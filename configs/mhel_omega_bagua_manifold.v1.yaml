schema_version: mhel-omega-bagua-manifold-v1
state: CANONICAL_DRAFT
claim_allowed: false
append_policy: APPENDING_BEYOND_ONLY
author_conceptual: Rafael Melo Reis — ∆RafaelVerboΩ

boundaries:
  cultural_sources_are_not_physical_proof: true
  symbolic_mapping_is_not_historical_equivalence: true
  six_sigma_requires_measured_baseline: true
  unknown_is_not_zero: true
  preserve_literal_before_inference: true

ontology:
  genealogy: [DAO_ORIGIN, ONE, TWO, THREE, MULTIPLICITY]
  binary_states:
    yin: 0
    yang: 1
  trigram_bits: 3
  trigram_count: 8
  hexagram_bits: 6
  hexagram_count: 64
  trigrams:
    - {id: QIAN, bits: '111'}
    - {id: DUI, bits: '110'}
    - {id: LI, bits: '101'}
    - {id: ZHEN, bits: '100'}
    - {id: XUN, bits: '011'}
    - {id: KAN, bits: '010'}
    - {id: GEN, bits: '001'}
    - {id: KUN, bits: '000'}
  five_phases:
    - {id: WOOD, operational_role: EXPAND}
    - {id: FIRE, operational_role: MANIFEST}
    - {id: EARTH, operational_role: STABILIZE}
    - {id: METAL, operational_role: SELECT}
    - {id: WATER, operational_role: STORE_RETURN}

window_model:
  thirds: 3
  roles: [ORIGIN_INPUT, TRANSFORM_MIDDLE, RECEIPT_OUTPUT]
  recursive_triplet: [START, MIDDLE, END]
  incomprehensible_route:
    preserve_literal: true
    groups:
      - TEXT_LANGUAGE
      - MATHEMATICS_GEOMETRY
      - CODE_BINARY
      - STORAGE_FORENSICS
      - SCIENCE_MEASUREMENT
      - SYMBOL_PARABLE
      - LEGAL_AUTHORSHIP
      - TOKEN_VAZIO

authorial_traversal:
  sequence: [4, 8, 3, 5, 2, 4, 8, 6]
  status: OPERATOR_AUTHORIAL_UNVALIDATED
  mapping:
    - FOUR_ORIENTATIONS
    - EIGHT_DIRECTIONS_OR_TRIGRAMS
    - THREE_LINES_OR_THIRDS
    - FIVE_PHASES
    - YIN_YANG_PAIR
    - FOUR_CURRENT_GATES
    - EIGHT_OPERATIONAL_INVARIANTS
    - SIX_LINES_OR_POSITIONS

manifold:
  point_fields: [source, syntax, semantics, dynamics, evidence, uncertainty, time, scale]
  trigram_space: '{0,1}^3'
  hexagram_space: '{0,1}^6'
  metric: HAMMING_DISTANCE
  transitions:
    minimum_line_change: 1
    preserve_previous_state: true
  epistemic_states:
    - KNOWS
    - FELTS
    - TOKEN_VAZIO
    - TOKEN_VAZIO_QUANTIFICADO
    - CONTRADICTED
    - REFUTED
    - UNKNOWN_UNKNOWN

complement_geometry:
  center_required: true
  modes: [EXACT_EQUIDISTANCE, WEIGHTED_EQUIDISTANCE, BOUNDED_EQUIDISTANCE]
  seed_relation: SEED_OF_COMPLEMENT

knowledge_expansion:
  coefficient_id: alpha_k
  formula: 'delta_radius / (initial_radius * delta_demand)'
  physical_claim: false
  zero_when_text_only_growth: true
  block_on_custody_break: true

six_sigma:
  method: DMAIC
  stages: [DEFINE, MEASURE, ANALYZE, IMPROVE, CONTROL]
  formulas:
    dpo: 'defects / (units * opportunities_per_unit)'
    dpmo: '1000000 * dpo'
    cp: '(usl - lsl) / (6 * sample_stddev)'
    cpk: 'min((usl - mean)/(3*sample_stddev), (mean - lsl)/(3*sample_stddev))'
  gates:
    maximum_margin_of_error_when_applicable: 0.03
    stable_process_before_capability: true
    measurement_system_required: true
    sample_sufficiency_required: true
    target_dpmo_reference: 3.4
    target_is_not_presumed_result: true

operational_invariants:
  - ORIGIN_AUTHORSHIP
  - FORM_READABILITY
  - SEMANTICS
  - TRANSFORMATION
  - RELATION_SYNERGY
  - EVIDENCE_FALSIFIER
  - UNCERTAINTY_STATISTICS
  - RETURN_CONTINUITY

receipt_required_fields:
  - source_hash
  - previous_event_hash
  - window_thirds
  - material_group
  - manifold_coordinates
  - trigram_state
  - hexagram_state
  - yin_yang_pair
  - five_phase_transition
  - alpha_k
  - dmaic_stage
  - sample_statistics
  - token_vazio
  - next_test
  - claim_allowed

hotfix_pipeline:
  - DETECT
  - PRESERVE_LITERAL
  - SPLIT_3_THIRDS
  - CLASSIFY_MATERIAL
  - ROUTE_SPECIALIST_GROUP
  - GENERATE_ALTERNATIVES
  - SCORE_CONFIDENCE
  - DEFINE_TEST
  - APPEND_RECEIPT

forbidden_promotions:
  - BAGUA_TO_PHYSICAL_PROOF
  - FENG_SHUI_TO_PERFORMANCE_PROOF
  - SYMBOL_TO_HISTORICAL_EQUIVALENCE
  - FELTS_TO_KNOWS_WITHOUT_EVIDENCE
  - SIGMA_WITHOUT_DATA
  - MANIFOLD_WITHOUT_POINTS_NEIGHBORHOOD_METRIC
