schema: rafaelia_repository_group_v1
schema_version: "1.0.0"
group_id: GRP_ENV_PLANETARY_PLASMA_RLL
generated_at: "2026-07-19"
state: PARTIAL
claim_allowed: false
authority:
  repository: rafaelmeloreisnovo/Mapa
  role: canonical_federation_registry

purpose: >-
  Organize the repositories that describe planetary environments, plasma,
  magnetism, atmospheric and oceanic electrodynamics, chemical phase changes,
  propagation effects and their bounded relation to RLL. The group records
  authority, typed relations and expansion routes; it does not promote a
  cross-scale analogy into physical identity or causality.

canonical_invariant:
  id: I_ENV_CONTEXT_01
  expression: >-
    possibility -> {carrier, medium, scale, state, conservation, rate,
    observable, uncertainty, baseline, falsifier} -> testable claim
  system_state: >-
    X=(M,R,Omega_rot,a_star,F_star,B,E,g,T,P,rho,x_chem,x_e,sigma,
    atmosphere,ocean,crust,time)
  observation_operator: >-
    O_obs = T_instrument o T_environment[X,nu,t] o T_cosmology[H(z),z]
    (O_source) + N
  reaction_graph: >-
    G_reaction=(V_species,E_reactions), with charge, baryon/nucleon,
    energy-momentum and declared-rate conservation gates
  rule: >-
    Similar geometry, frequency or vocabulary across scales is a contextual
    relation only. It becomes a physical bridge only after the carrier,
    coupling, units, boundary conditions and discriminating observable exist.

mandatory_gates:
  - carrier
  - medium
  - spatial_and_temporal_scale
  - state_variables_and_units
  - boundary_and_initial_conditions
  - conservation_laws
  - constitutive_or_rate_equation
  - source_and_provenance
  - instrument_or_simulation
  - uncertainty_and_covariance
  - standard_baseline
  - falsifier
  - reproduction_artifact_and_checksum

relation_types:
  STANDARD_MECHANISM: established mechanism used as a baseline
  MODULATES: changes amplitude, phase, rate or boundary conditions
  COUPLES: explicit mathematical interaction with units and carrier
  CORRELATES_WITH: statistical association without causal promotion
  CONTEXTUALIZES: provides domain meaning without equation equivalence
  SCALE_BRIDGE_HYPOTHESIS: proposed micro-meso-astro-cosmo bridge awaiting proof
  ANALOGY_ONLY: didactic or geometric similarity only
  REQUIRES: hard dependency for execution or claim promotion
  PRODUCES_ARTIFACT_FOR: versioned producer-consumer relation
  CONTRADICTS: incompatible statements preserved for resolution
  FALSIFIES: observation or test capable of rejecting a claim
  PROJECTS_TO_REPOSITORY: domain-specific projection of the canonical invariant

