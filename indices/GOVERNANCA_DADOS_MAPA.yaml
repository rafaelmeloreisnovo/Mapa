    state: FATO
  roadmap:
    path: roadmaps/ROADMAP_GOVERNANCA_DADOS_6SIGMA.md
    state: FATO

quality_gates:
  - id: GATE-STRUCTURE
    command: "python3 -S scripts/validate_chain_of_custody.py indices/CADEIA_CUSTODIA_EVENTOS.jsonl --repo-root ."
    observed_result: PASS
    blocks_claim_on_failure: true
  - id: GATE-REGRESSION
    command: "python3 -S -m unittest discover -s tests -p 'test_*.py'"
    observed_result: "PASS: 19 tests"
    blocks_claim_on_failure: true
  - id: GATE-BASELINE
    command: "python3 -S scripts/measure_custody_baseline.py indices/CADEIA_CUSTODIA_EVENTOS.jsonl --repo-root ."
    observed_result: PASS
    blocks_claim_on_failure: true
  - id: GATE-HUMAN-REVIEW
    command: TOKEN_VAZIO
    reason: "Revisao humana final e decisao de merge ainda nao executadas."
    next_verifiable_step: "Revisar o diff completo do PR e registrar decisao sem merge automatico."

