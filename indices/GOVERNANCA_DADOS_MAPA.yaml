schema: mapa_governanca_dados_v1
id: GOV-CUSTODY-6SIGMA
repository: rafaelmeloreisnovo/Mapa
branch: codex/governanca-cadeia-custodia-6sigma
status: PILOT_MEASURED
claim_allowed_programa: false
merge_allowed: false
remote_ci_required_this_cycle: false

invariants:
  - id: INV-01
    rule: "Toda conclusao exige evidencia referenciada."
    enforcement: scripts/validate_chain_of_custody.py
  - id: INV-02
    rule: "TOKEN_VAZIO exige operation=TOKEN_VAZIO, claim_allowed=false e proximo passo verificavel."
    enforcement: scripts/validate_chain_of_custody.py
  - id: INV-03
    rule: "previous_event_id referencia o evento valido imediatamente anterior."
    enforcement: scripts/validate_chain_of_custody.py
  - id: INV-04
    rule: "CORRECT usa supersedes_event_id e nao apaga historico."
    enforcement: schema+validator+review
  - id: INV-05
    rule: "Caminhos sao relativos, sem traversal ou barra invertida."
    enforcement: scripts/validate_chain_of_custody.py
  - id: INV-06
    rule: "Evento invalido nao se torna ancora da cadeia."
    enforcement: scripts/validate_chain_of_custody.py
  - id: INV-07
    rule: "Nivel sigma nao e declarado antes de estabilidade e convencao estatistica aprovadas."
    enforcement: scripts/measure_custody_baseline.py+review

