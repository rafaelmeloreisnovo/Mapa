schema: rafaelia.spectral-geometry-invariant.v1
status: hypothesis_pre_registered_with_reference_execution
claim_allowed: false

separation_of_concerns:
  operational_receipts_are_scientific_evidence: false
  mathematical_scaling_is_microscopic_derivation: false
  visual_similarity_is_invariant: false
  semantic_pattern_is_physical_law: false
  numerical_convergence_is_physical_confirmation: false

operator_family:
  continuum:
    definition: "L_M = -Delta_g + xi*R + V(x)"
    eigenproblem: "L_M psi_k = lambda_k psi_k"
  sphere_reference:
    manifold: "S^2_R"
    eigenvalues: "lambda_l = l(l+1)/R^2"
    degeneracy: "g_l = 2l+1"
    cumulative_modes: "N(L) = (L+1)^2"
  discrete_primary:
    generalized_eigenproblem: "L u = lambda M u"
    realization: cotangent_stiffness_with_lumped_vertex_mass
  discrete_operator_control:
    realization: normalized_graph_laplacian
    role: operator_sensitivity_only

geometries:
  target_family:
    - sphere_reference
    - tetrahedron
    - cube
    - icosahedron
    - icosahedral_geodesic_l1
    - icosahedral_geodesic_l2
  alternate_triangulation_control:
    - octahedron
    - octahedral_geodesic_l1
    - octahedral_geodesic_l2

primary_hypothesis:
  id: H1
  statement: "The declared RAFAELIA geometry family may contain normalized spectral invariants that survive controlled continuous-to-discrete refinement."
  state: PARTIAL_NUMERICAL_SUPPORT_FOR_CONTINUUM_DISCRETE_CONVERGENCE_ONLY
  promotion_state: TOKEN_VAZIO_PENDING_REMOTE_AND_INDEPENDENT_IMPLEMENTATION_REPLICATION
  claim_allowed: false

observables:
  - normalized_eigenvalue_ratios
  - eigenspace_multiplicities
  - cumulative_mode_count_N_lambda
  - surface_area_error
  - low_mode_refinement_convergence_error
  - operator_sensitivity
  - triangulation_family_sensitivity

controls:
  scale_normalization_required: true
  multiple_triangulations_required: true
  multiple_triangulation_families_observed: 2
  multiple_refinement_levels_required: true
  operator_sensitivity_required: true
  operator_sensitivity_implemented: COTANGENT_VS_NORMALIZED_GRAPH
  statistical_null_model_required_for_statistical_claim: true
  statistical_null_model: TOKEN_VAZIO_JUSTIFIED_NULL_DISTRIBUTION_NOT_DEFINED
  statistical_inference_performed_in_reference_run: false
  multiple_comparison_correction: NOT_APPLICABLE_TO_CURRENT_DESCRIPTIVE_DISTANCE_ONLY
  independent_implementation_replication_required_for_promotion: true

pre_registered_constant_scan:
  constants:
    - "sqrt(3)/2"
    - phi
    - 633
    - 999
  pre_registered_before_reference_execution:
    constants: true
    numerical_match_tolerance: false
  experiment_v1_relative_tolerance: 0.01
  threshold_provenance: SET_IN_EXPERIMENT_V1_BEFORE_REMOTE_REPRODUCTION_NOT_BEFORE_REFERENCE_RUN
  scope: positive_eigenvalue_ratios_only
  rule: "Do not fit geometry or normalization to manufacture a match. Reject associations that disappear under rescaling, remeshing, operator change, justified null controls, or independent replication."
  current_result: REFERENCE_RUN_NO_MATCH_REJECT_CURRENT_SCAN_PENDING_REMOTE_REPRODUCTION
  claim_allowed: false

observed_reference_run:
  execution_context: CHATGPT_CONTAINER_REFERENCE
