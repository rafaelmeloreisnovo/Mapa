horizon_information_boundary:
  allowed_statement: "For a two-dimensional compact surface, spectral mode counting has leading asymptotic scaling controlled by area; a Planck-scale cutoff therefore gives the same area-dimension scaling form as A/l_P^2."
  forbidden_promotions:
    - derives_Bekenstein_Hawking_entropy
    - derives_factor_one_quarter
    - identifies_black_hole_microstates
    - proves_holography
    - equates_atomic_orbitals_with_horizon_microstates
