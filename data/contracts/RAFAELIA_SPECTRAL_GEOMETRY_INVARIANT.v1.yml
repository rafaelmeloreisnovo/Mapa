    - factor_one_quarter_derivation
    - physical_degrees_of_freedom_per_mode

anti_regression:
  reject_when:
    - claim_allowed_becomes_true_without_separate_promotion_gate
    - reference_baseline_cannot_be_deterministically_reproduced_by_same_implementation
    - convergence_flags_regress_without_explained_numerical_change
    - a_constant_match_requires_post_hoc_geometry_or_normalization_choice
    - a_constant_association_fails_operator_or_triangulation_sensitivity
  preserve_when_missing: TOKEN_VAZIO

ethics_by_design:
  provenance_required: true
  uncertainty_visible: true
  no_automatic_claim_promotion: true
  no_automatic_publication: true
  falsification_path_required: true
