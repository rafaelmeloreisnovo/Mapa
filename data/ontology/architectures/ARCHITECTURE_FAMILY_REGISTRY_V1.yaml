schema: rafaelia.architecture-family-registry/v1
version: 1.0.0
state: DRAFT_AUDITABLE
claim_allowed: false
purpose: >-
  Normalize historical RAFAELIA AI, framework, module, layer, protocol, command,
  runtime and research-family names without promoting labels, folders or old
  assistant assertions into implementation or runtime evidence.

coverage:
  mode: DEEP_STRUCTURAL_SEED_NOT_TERMINAL
  corpus_family: NOVOexport
  source_bound_conversations_observed: 144
  title_occurrences_observed: 179
  warning: >-
    This registry is a structural convergence seed, not a bytewise exhaustive
    enumeration of every NOVOexport JSON/JSONL shard. New evidence appends or
    refines records; it must not silently overwrite historical identity.

invariants:
  - "NAME != FAMILY != VARIANT != MODULE != LAYER != PROTOCOL != COMMAND != RUNTIME != EVIDENCE != CLAIM"
  - "CONCEPT != IMPLEMENTATION != BUILD != EXECUTION != EVIDENCE != CLAIM"
  - "SAME_LABEL != SAME_CONTENT"
  - "FOLDER != IMPLEMENTATION"
  - "HISTORICAL_ASSISTANT_ASSERTION != PRIMARY_EVIDENCE"
  - "TOKEN_VAZIO != ZERO"
  - "PRIVATE_POINTER != PUBLIC_PAYLOAD"
  - "PROVENANCE_PRECEDES_PROMOTION"

entity_kinds:
  - AI_FAMILY
  - FRAMEWORK_FAMILY
  - VERSION_LINEAGE
  - MODULE_FAMILY
  - DATA_LAYER
  - PROTOCOL_FAMILY
  - COMMAND_FAMILY
  - RUNTIME_FAMILY
  - RESEARCH_FAMILY
  - ONTOLOGY_FAMILY
  - IMPLEMENTATION_TREE
  - SECURITY_OR_CLEANUP_ALIAS
  - UNRESOLVED_TERM

implementation_states:
  - SOURCE_BOUND_IDENTITY
  - DOCUMENTED_CONCEPT
  - IMPLEMENTATION_TREE_OBSERVED
  - IMPLEMENTATION_PARTIAL_UNVERIFIED
  - IMPLEMENTATION_STUB
  - RUNTIME_UNVERIFIED
  - TOKEN_VAZIO

provenance_classes:
  - NOVOEXPORT_TITLE_REGISTRY
  - NOVOEXPORT_MESSAGE_SHARD
  - DRIVE_PHYSICAL_TREE
  - DRIVE_DOCUMENT
  - MAPA_REPOSITORY
  - HISTORICAL_ASSISTANT_ASSERTION
  - CURRENT_QUERY_TERM

