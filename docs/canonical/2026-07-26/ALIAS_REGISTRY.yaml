schema: rafaelia.alias-registry.v1
created_at: '2026-07-26'
state: CANONICAL_DRAFT
claim_allowed: false
resolution_policy:
  accepted_states:
    - RESOLVED_EXACT
    - RESOLVED_CONTEXTUAL
    - PROVISIONAL
    - TOKEN_VAZIO_ALIAS_RESOLUTION
  prohibition: alias provisional nunca pode substituir identidade de repositório em build, hash, recibo ou claim
aliases:
  - alias: Rafa22
    normalized: rafa22
    state: TOKEN_VAZIO_ALIAS_RESOLUTION
    provisional_candidate:
      repository: rafaelmeloreisnovo/Rafaelia_Private
      subsystems:
        - RAFAELIA_ZERO
        - OMEGA42
    evidence_for_candidate:
      - contexto recorrente associa Rafa22 ao núcleo privado e aos subsistemas ZERO e OMEGA42
      - auditoria anterior não encontrou repositório literal Rafa22
    evidence_missing:
      - declaração autoral explícita de equivalência
      - arquivo canônico contendo alias Rafa22
      - mapeamento de versão ou significado do número 22
    operational_rule:
      - usar rafaelmeloreisnovo/Rafaelia_Private apenas como candidato provisório
      - registrar repository_full_name real em toda execução
      - manter rafa22_alias como TOKEN_VAZIO até prova direta
  - alias: RafaPolimata
    normalized: rafpolimata
    state: RESOLVED_EXACT
    canonical_repository: rafaelmeloreisnovo/RafPolimata
    canonical_role: parser_compiler_evidence_and_apkc
  - alias: Rafa Polimata
    normalized: rafpolimata
    state: RESOLVED_CONTEXTUAL
    canonical_repository: rafaelmeloreisnovo/RafPolimata
  - alias: Lectra
    normalized: vectras
    state: RESOLVED_CONTEXTUAL
    canonical_repository: rafaelmeloreisnovo/Vectras-VM-Android
    interpretation: variação oral ou transcrição de Vectras
    limitation: recibos devem usar Vectras-VM-Android e não Lectra
  - alias: Vectra
    normalized: vectras
    state: RESOLVED_CONTEXTUAL
    canonical_repository: rafaelmeloreisnovo/Vectras-VM-Android
  - alias: Vectras
    normalized: vectras
    state: RESOLVED_EXACT
    canonical_repository: rafaelmeloreisnovo/Vectras-VM-Android
  - alias: Termux RAFCODEPhi
    normalized: termux_rafacodephi
    state: RESOLVED_CONTEXTUAL
    canonical_repository: rafaelmeloreisnovo/termux-app-rafacodephi
  - alias: QEMU Rafaelia
    normalized: qemu_rafaelia
    state: RESOLVED_EXACT
    canonical_repository: rafaelmeloreisnovo/qemu_rafaelia
  - alias: Mapa
    normalized: mapa
    state: RESOLVED_EXACT
    canonical_repository: rafaelmeloreisnovo/Mapa
  - alias: CONVERSATIONS_CHUNKS_PRIVATE
    normalized: conversations_chunks_private
    state: TOKEN_VAZIO_ALIAS_RESOLUTION
    canonical_repository: TOKEN_VAZIO_REPOSITORY_RESOLUTION
    known_role: produtor ou armazenamento privado de chunks e descritores
    required_evidence:
      - repository_or_drive_identity
      - producer_commit
      - descriptor_contract_version
      - artifact_path_and_hashes
validation_rules:
  - normalized aliases não alteram grafia do repository_full_name
  - aliases não podem ser usados como source_commit
  - aliases provisórios exigem token_vazio explícito em manifests
  - resolução contextual é válida para navegação, não para identidade criptográfica
closure:
  cycle: C01
  exact_aliases: PASS_DOCUMENTARY
  contextual_aliases: PASS_DOCUMENTARY
  rafa22: TOKEN_VAZIO_ALIAS_RESOLUTION
  conversations_chunks_private: TOKEN_VAZIO_REPOSITORY_RESOLUTION
  overall: PARTIAL_DOCUMENTARY