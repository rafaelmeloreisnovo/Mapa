name: RAFAELIA Top-30 Operational Excellence

on:
  schedule:
    - cron: "57 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "data/control-plane/RAFAELIA_TOP30_OPERATIONAL_EXCELLENCE.v1.json"
      - "scripts/validate_top30_operational_excellence.py"
      - "tests/test_top30_operational_excellence.py"
      - "docs/architecture/RAFAELIA_TOP30_OPERATIONAL_EXCELLENCE_V1.md"
      - ".github/workflows/rafaelia-top30-operational-excellence.yml"

permissions:
  contents: read

concurrency:
  group: rafaelia-top30-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Contract and adversarial tests
        run: python -m unittest -v tests.test_top30_operational_excellence

      - name: Produce Top-30 receipt
        run: |
          python scripts/validate_top30_operational_excellence.py \
            --output-dir artifacts/rafaelia-top30

      - name: Verify non-promotion boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('artifacts/rafaelia-top30/top30_receipt.json').read_text())
          assert receipt['decision'] == 'EXECUTED_READ_ONLY'
          assert receipt['claim_allowed'] is False
          assert receipt['automatic_mutation'] is False
          assert receipt['automatic_merge'] is False
          assert receipt['summary']['practice_count'] == 30
          assert len(receipt['summary']['top10_open_actions']) == 10
          PY

      - name: Upload Top-30 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rafaelia-top30-${{ github.run_id }}
          path: artifacts/rafaelia-top30/
          if-no-files-found: error
          retention-days: 30
