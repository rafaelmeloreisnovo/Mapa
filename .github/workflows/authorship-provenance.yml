name: authorship-provenance

on:
  pull_request:
    paths:
      - "AUTHORS_RAFAELIA.md"
      - "docs/governance/AUTHORSHIP_PROVENANCE_INVARIANT_V1.md"
      - "data/control-plane/authorship-provenance-policy.v1.json"
      - "schemas/authorship-provenance-record.schema.json"
      - "data/authorship/**"
      - "tools/verify_authorship_provenance.py"
      - "tests/test_authorship_provenance.py"
      - ".github/workflows/authorship-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout pinned revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Run authorship tests
        run: python -m unittest tests.test_authorship_provenance -v

      - name: Validate primary authorship registry
        run: >-
          python tools/verify_authorship_provenance.py
          --policy data/control-plane/authorship-provenance-policy.v1.json
          --schema schemas/authorship-provenance-record.schema.json
          --registry data/authorship/authorship_registry.delta.20260803.jsonl
          --report /tmp/authorship-provenance-primary.json

      - name: Validate Drive authorship registry
        run: >-
          python tools/verify_authorship_provenance.py
          --policy data/control-plane/authorship-provenance-policy.v1.json
          --schema schemas/authorship-provenance-record.schema.json
          --registry data/authorship/authorship_registry.drive.delta.20260803.jsonl
          --report /tmp/authorship-provenance-drive.json

      - name: Expose validation boundaries
        run: |
          cat /tmp/authorship-provenance-primary.json
          cat /tmp/authorship-provenance-drive.json
