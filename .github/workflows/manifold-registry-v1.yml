name: Manifold Registry V1
on:
  pull_request:
    paths:
      - 'schemas/manifold-*.json'
      - 'data/manifold/**'
      - 'tools/validate_manifold_registry.py'
      - 'tools/resolve_manifold_route.py'
      - 'tests/test_manifold*.py'
      - 'tests/fixtures/manifold_route_resolver_cases.json'
      - '.github/workflows/manifold-registry-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate registry
        run: python tools/validate_manifold_registry.py data/manifold/edges_omega_v1.jsonl data/manifold/routes_omega_v1.jsonl
      - name: Run manifold tests
        run: python -m unittest tests.test_manifold_registry tests.test_manifold_route_resolver
