# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow requires that you have an existing account with codescan.io
# For more information about configuring your workflow,
# read our documentation at https://github.com/codescan-io/codescan-scanner-action
name: CodeScan

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '40 13 * * 5'

permissions:
  contents: read

jobs:
    CodeScan:
        permissions:
          contents: read # for actions/checkout to fetch code
          security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
          actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            -   name: Checkout repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            -   name: Cache files
                uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: |
                        ~/.sonar
                    key: ${{ runner.os }}-sonar
                    restore-keys: ${{ runner.os }}-sonar
            -   name: Verify CodeScan credential presence
                shell: bash
                env:
                    CODESCAN_AUTH_TOKEN: ${{ secrets.CODESCAN_AUTH_TOKEN }}
                    CODESCAN_ORGANIZATION_KEY: ${{ secrets.CODESCAN_ORGANIZATION_KEY }}
                    CODESCAN_PROJECT_KEY: ${{ secrets.CODESCAN_PROJECT_KEY }}
                run: |
                    missing=0
                    for name in CODESCAN_AUTH_TOKEN CODESCAN_ORGANIZATION_KEY CODESCAN_PROJECT_KEY; do
                      if [[ -n "${!name}" ]]; then
                        echo "$name=PRESENT"
                      else
                        echo "$name=MISSING" >&2
                        missing=1
                      fi
                    done
                    if (( missing != 0 )); then
                      echo "CodeScan credential preflight failed; secret values were not printed." >&2
                      exit 1
                    fi
            -   name: Run Analysis
                uses: codescan-io/codescan-scanner-action@0bc7259c0e362feda5c3e085f0f9fcf36c8d03ca # 2.0 (node20)
                with:
                    login: ${{ secrets.CODESCAN_AUTH_TOKEN }}
                    organization: ${{ secrets.CODESCAN_ORGANIZATION_KEY }}
                    projectKey: ${{ secrets.CODESCAN_PROJECT_KEY }}
                    generateSarifFile: true
            -   name: Require CodeScan SARIF
                shell: bash
                run: |
                    if [ ! -s codescan.sarif ]; then
                      echo "::error::CodeScan did not produce a non-empty codescan.sarif; failing closed before upload."
                      exit 1
                    fi
            -   name: Upload SARIF file
                uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v3
                with:
                    sarif_file: codescan.sarif
