name: Topology and Inventory Structural Validation

on:
  pull_request:
    paths:
      - "indices/GRAFO_DEPENDENCIAS_MAPA.yaml"
      - "indices/REPOSITORY_INVENTORY.json"
      - "indices/REPOSITORY_INVENTORY_HEAD.json"
      - "indices/TOROIDAL_RESEARCH_FEDERATION.json"
      - "indices/inventory_batches/**"
      - "indices/inventory_deltas/**"
      - "schemas/repository_inventory.schema.json"
      - "schemas/repository_inventory_batch.schema.json"
      - "biblioteconomia/19_TOROIDAL_RESEARCH_FEDERATION.md"
      - "orquestrador/QUALITY_GATE_POLICY.md"
      - "scripts/validate_mapa_topology.py"
      - "scripts/validate_repository_inventory.py"
      - "scripts/apply_repository_inventory_batch.py"
      - "scripts/validate_repository_inventory_batch_chain.py"
      - "scripts/validate_repository_inventory_head.py"
      - "scripts/validate_toroidal_research_federation.py"
      - "tests/test_topology.py"
      - "tests/test_repository_inventory.py"
      - "tests/test_inventory_batch.py"
      - "tests/test_inventory_batch_chain.py"
      - "tests/test_inventory_head.py"
      - "tests/test_toroidal_research_federation.py"
      - ".github/workflows/topology-validation.yml"
  push:
    branches: [main]
    paths:
      - "indices/GRAFO_DEPENDENCIAS_MAPA.yaml"
      - "indices/REPOSITORY_INVENTORY.json"
      - "indices/REPOSITORY_INVENTORY_HEAD.json"
      - "indices/TOROIDAL_RESEARCH_FEDERATION.json"
      - "indices/inventory_batches/**"
      - "indices/inventory_deltas/**"
      - "schemas/repository_inventory.schema.json"
      - "schemas/repository_inventory_batch.schema.json"
      - "biblioteconomia/19_TOROIDAL_RESEARCH_FEDERATION.md"
      - "orquestrador/QUALITY_GATE_POLICY.md"
      - "scripts/validate_mapa_topology.py"
      - "scripts/validate_repository_inventory.py"
      - "scripts/apply_repository_inventory_batch.py"
      - "scripts/validate_repository_inventory_batch_chain.py"
      - "scripts/validate_repository_inventory_head.py"
      - "scripts/validate_toroidal_research_federation.py"
      - "tests/test_topology.py"
      - "tests/test_repository_inventory.py"
      - "tests/test_inventory_batch.py"
      - "tests/test_inventory_batch_chain.py"
      - "tests/test_inventory_head.py"
      - "tests/test_toroidal_research_federation.py"
      - ".github/workflows/topology-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: topology-inventory-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compile stdlib validators, applicators and tests
        run: |
          python3 -m py_compile scripts/validate_mapa_topology.py
          python3 -m py_compile scripts/validate_repository_inventory.py
          python3 -m py_compile scripts/apply_repository_inventory_batch.py
          python3 -m py_compile scripts/validate_repository_inventory_batch_chain.py
          python3 -m py_compile scripts/validate_repository_inventory_head.py
          python3 -m py_compile scripts/validate_toroidal_research_federation.py
          python3 -m py_compile tests/test_topology.py
          python3 -m py_compile tests/test_repository_inventory.py
          python3 -m py_compile tests/test_inventory_batch.py
          python3 -m py_compile tests/test_inventory_batch_chain.py
          python3 -m py_compile tests/test_inventory_head.py
          python3 -m py_compile tests/test_toroidal_research_federation.py

      - name: Run topology unit tests
        run: python3 -m unittest tests/test_topology.py -v

      - name: Run inventory adversarial tests
        run: python3 -m unittest tests/test_repository_inventory.py -v

      - name: Run inventory batch and chain adversarial tests
        run: |
          python3 -m unittest \
            tests/test_inventory_batch.py \
            tests/test_inventory_batch_chain.py \
            -v

      - name: Run atomic inventory head adversarial tests
        run: python3 -m unittest tests/test_inventory_head.py -v

      - name: Run toroidal federation adversarial tests
        run: python3 -m unittest tests/test_toroidal_research_federation.py -v

      - name: Validate canonical topology
        run: |
          python3 scripts/validate_mapa_topology.py \
            --write-report topology-validation.json

      - name: Validate immutable inventory checkpoint
        run: |
          python3 scripts/validate_repository_inventory.py \
            --write-report repository-inventory-validation.json

      - name: Validate checkpoint batches as fixed points
        run: |
          python3 scripts/validate_repository_inventory_batch_chain.py \
            --inventory indices/REPOSITORY_INVENTORY.json \
            --batches-dir indices/inventory_batches \
            --write-report inventory-batch-chain-validation.json

      - name: Validate atomic inventory head and post-checkpoint deltas
        run: |
          python3 scripts/validate_repository_inventory_head.py \
            --head indices/REPOSITORY_INVENTORY_HEAD.json \
            --write-report repository-inventory-head-validation.json

      - name: Validate toroidal research federation registry
        run: |
          python3 scripts/validate_toroidal_research_federation.py \
            --write-report toroidal-federation-validation.json

      - name: Check machine-readable artifacts and claim boundary
        run: |
          python3 -m json.tool topology-validation.json >/dev/null
          python3 -m json.tool repository-inventory-validation.json >/dev/null
          python3 -m json.tool inventory-batch-chain-validation.json >/dev/null
          python3 -m json.tool repository-inventory-head-validation.json >/dev/null
          python3 -m json.tool toroidal-federation-validation.json >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import json

          raw = Path("indices/GRAFO_DEPENDENCIAS_MAPA.yaml").read_text(encoding="utf-8")
          topology = json.loads(raw[raw.find("{"):])
          checkpoint = json.loads(
              Path("indices/REPOSITORY_INVENTORY.json").read_text(encoding="utf-8")
          )
          head = json.loads(
              Path("indices/REPOSITORY_INVENTORY_HEAD.json").read_text(encoding="utf-8")
          )
          checkpoint_report = json.loads(
              Path("repository-inventory-validation.json").read_text(encoding="utf-8")
          )
          chain_report = json.loads(
              Path("inventory-batch-chain-validation.json").read_text(encoding="utf-8")
          )
          head_report = json.loads(
              Path("repository-inventory-head-validation.json").read_text(encoding="utf-8")
          )
          federation_report = json.loads(
              Path("toroidal-federation-validation.json").read_text(encoding="utf-8")
          )

          checkpoint_count = checkpoint["scope"]["materialized_count"]
          assert topology["schema"] == "mapa_topology_v2"
          assert topology["declared_metrics"]["cycle_count"] == 0
          assert topology["declared_metrics"]["orphan_count"] == 0
          assert checkpoint["schema"] == "repository_inventory_v2"
          assert checkpoint["scope"]["state"] == "PARTIAL"
          assert checkpoint["scope"]["claim_allowed"] is False
          assert checkpoint_count == len(checkpoint["repositories"])
          assert checkpoint_report["status"] == "PASS"
          assert checkpoint_report["claim_allowed"] is False
          assert chain_report["status"] == "PASS"
          assert chain_report["all_batches_fixed_points"] is True
          assert chain_report["claim_allowed"] is False
          assert (
              chain_report["total_batch_records"]
              + chain_report["baseline_unbatched_records"]
              == checkpoint_count
          )
          assert head["schema"] == "repository_inventory_head_v1"
          assert head["checkpoint"]["materialized_count"] == checkpoint_count
          assert head["derived"]["materialized_count"] == 51
          assert head["derived"]["remaining_token_vazio"] == 75
          assert head["derived"]["inventory_state"] == "PARTIAL"
          assert head["derived"]["claim_allowed"] is False
          assert head_report["status"] == "PASS"
          assert head_report["materialized_count"] == 51
          assert head_report["remaining_token_vazio"] == 75
          assert head_report["all_delta_batches_fixed_points"] is True
          assert head_report["claim_allowed"] is False
          assert federation_report["status"] == "PASS"
          assert federation_report["repository_count"] == 6
          assert federation_report["active_count"] == 4
          assert federation_report["adapter_planned_count"] == 0
          assert federation_report["token_vazio_count"] == 2
          assert federation_report["cycle_count"] == 0
          assert federation_report["claim_allowed"] is False
          PY

      - name: Create checksums
        run: |
          {
            printf '%s\n' \
              indices/GRAFO_DEPENDENCIAS_MAPA.yaml \
              indices/REPOSITORY_INVENTORY.json \
              indices/REPOSITORY_INVENTORY_HEAD.json \
              indices/TOROIDAL_RESEARCH_FEDERATION.json \
              schemas/repository_inventory.schema.json \
              schemas/repository_inventory_batch.schema.json \
              biblioteconomia/19_TOROIDAL_RESEARCH_FEDERATION.md \
              orquestrador/QUALITY_GATE_POLICY.md \
              scripts/validate_mapa_topology.py \
              scripts/validate_repository_inventory.py \
              scripts/apply_repository_inventory_batch.py \
              scripts/validate_repository_inventory_batch_chain.py \
              scripts/validate_repository_inventory_head.py \
              scripts/validate_toroidal_research_federation.py \
              tests/test_topology.py \
              tests/test_repository_inventory.py \
              tests/test_inventory_batch.py \
              tests/test_inventory_batch_chain.py \
              tests/test_inventory_head.py \
              tests/test_toroidal_research_federation.py \
              .github/workflows/topology-validation.yml
            find indices/inventory_batches -maxdepth 1 -type f -name '*.json' -print
            find indices/inventory_deltas -maxdepth 1 -type f -name '*.json' -print
          } | LC_ALL=C sort | xargs sha256sum > STRUCTURAL_CHECKSUMS.sha256

      - name: Upload structural audit
        uses: actions/upload-artifact@v4
        with:
          name: mapa-structural-validation
          path: |
            topology-validation.json
            repository-inventory-validation.json
            inventory-batch-chain-validation.json
            repository-inventory-head-validation.json
            toroidal-federation-validation.json
            STRUCTURAL_CHECKSUMS.sha256
          if-no-files-found: error
          retention-days: 30
