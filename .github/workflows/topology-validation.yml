name: Topology and Inventory Structural Validation

on:
  pull_request:
    paths:
      - "indices/**"
      - "schemas/**"
      - "biblioteconomia/**"
      - "docs/**"
      - "resultados/**"
      - "orquestrador/QUALITY_GATE_POLICY.md"
      - "scripts/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/topology-validation.yml"
  push:
    branches: [main]
    paths:
      - "indices/**"
      - "schemas/**"
      - "biblioteconomia/**"
      - "docs/**"
      - "resultados/**"
      - "orquestrador/QUALITY_GATE_POLICY.md"
      - "scripts/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/topology-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: topology-inventory-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compile stdlib control plane
        run: |
          python3 -m py_compile \
            scripts/validate_mapa_topology.py \
            scripts/validate_repository_inventory.py \
            scripts/apply_repository_inventory_batch.py \
            scripts/validate_repository_inventory_batch_chain.py \
            scripts/validate_repository_inventory_head.py \
            scripts/validate_toroidal_research_federation.py \
            scripts/validate_platform_assurance_pointer.py \
            scripts/validate_iso_operational_readiness.py \
            scripts/validate_claim_vocabulary.py \
            scripts/validate_claim_contradiction_ledger.py \
            scripts/validate_claim_review_chain.py \
            scripts/validate_claim_review_residual.py \
            scripts/validate_claim_discovery_precision.py \
            scripts/validate_claim_resolution_contract.py \
            scripts/build_claim_scope_refresh.py \
            scripts/validate_g006_auxiliary_receipt.py \
            scripts/run_g006_local_gate.py \
            tools/materialize_github_blob.py \
            tests/test_topology.py \
            tests/test_repository_inventory.py \
            tests/test_inventory_batch.py \
            tests/test_inventory_batch_chain.py \
            tests/test_inventory_head.py \
            tests/test_toroidal_research_federation.py \
            tests/test_platform_assurance_pointer.py \
            tests/test_iso_operational_readiness.py \
            tests/test_claim_vocabulary.py \
            tests/test_claim_contradiction_ledger.py \
            tests/test_claim_review_chain.py \
            tests/test_claim_review_residual.py \
            tests/test_claim_discovery_precision.py \
            tests/test_claim_resolution_contract.py \
            tests/test_claim_scope_refresh.py \
            tests/test_github_blob_materializer.py \
            tests/test_g006_local_gate.py \
            tests/test_g006_auxiliary_receipt.py

      - name: Run positive and adversarial tests
        run: |
          python3 -m unittest -v \
            tests/test_topology.py \
            tests/test_repository_inventory.py \
            tests/test_inventory_batch.py \
            tests/test_inventory_batch_chain.py \
            tests/test_inventory_head.py \
            tests/test_toroidal_research_federation.py \
            tests/test_platform_assurance_pointer.py \
            tests/test_iso_operational_readiness.py \
            tests/test_claim_vocabulary.py \
            tests/test_claim_contradiction_ledger.py \
            tests/test_claim_review_chain.py \
            tests/test_claim_review_residual.py \
            tests/test_claim_discovery_precision.py \
            tests/test_claim_resolution_contract.py \
            tests/test_claim_scope_refresh.py \
            tests/test_github_blob_materializer.py \
            tests/test_g006_local_gate.py \
            tests/test_g006_auxiliary_receipt.py

      - name: Validate topology and inventory
        run: |
          python3 scripts/validate_mapa_topology.py \
            --write-report topology-validation.json
          python3 scripts/validate_repository_inventory.py \
            --write-report repository-inventory-validation.json
          python3 scripts/validate_repository_inventory_batch_chain.py \
            --inventory indices/REPOSITORY_INVENTORY.json \
            --batches-dir indices/inventory_batches \
            --write-report inventory-batch-chain-validation.json
          python3 scripts/validate_repository_inventory_head.py \
            --head indices/REPOSITORY_INVENTORY_HEAD.json \
            --write-report repository-inventory-head-validation.json

      - name: Validate federation and operational readiness
        run: |
          python3 scripts/validate_toroidal_research_federation.py \
            --write-report toroidal-federation-validation.json
          python3 scripts/validate_platform_assurance_pointer.py \
            --write-report platform-assurance-pointer-validation.json
          python3 scripts/validate_iso_operational_readiness.py \
            --write-report iso-operational-readiness-validation.json

      - name: Validate G006 claim control plane
        run: |
          python3 scripts/validate_claim_vocabulary.py \
            --root . \
            --policy indices/CLAIM_VOCABULARY_POLICY.json \
            --write-report claim-vocabulary-validation.json
          python3 scripts/validate_claim_contradiction_ledger.py \
            --path indices/CLAIM_CONTRADICTION_LEDGER.json \
            --write-report claim-contradiction-ledger-validation.json
          python3 scripts/validate_claim_review_chain.py \
            --head indices/CLAIM_CONTRADICTION_HEAD.json \
            --write-report claim-review-chain-validation.json
          python3 scripts/validate_claim_review_residual.py \
            --residual indices/CLAIM_REVIEW_RESIDUAL.json \
            --resolution indices/CLAIM_REVIEW_RESOLUTION_CC028.json \
            --head indices/CLAIM_CONTRADICTION_HEAD.json \
            --write-report claim-review-residual-validation.json
          python3 scripts/validate_claim_discovery_precision.py \
            --root . \
            --policy indices/CLAIM_VOCABULARY_POLICY.json \
            --write-report claim-discovery-precision-validation.json
          python3 scripts/validate_claim_resolution_contract.py \
            --path indices/CLAIM_REVIEW_RESOLUTION_CC028.json \
            --write-report claim-resolution-contract-validation.json
          python3 scripts/build_claim_scope_refresh.py \
            --ledger indices/CLAIM_CONTRADICTION_LEDGER.json \
            --head indices/CLAIM_CONTRADICTION_HEAD.json \
            --claim-scan claim-vocabulary-validation.json \
            --precision claim-discovery-precision-validation.json \
            --current-commit "${GITHUB_SHA}" \
            --write-report claim-scope-refresh-validation.json
          python3 scripts/validate_g006_auxiliary_receipt.py \
            --receipt resultados/G006_AUXILIARY_LOCAL_VALIDATION_2026-07-21.json \
            --root . \
            --write-report g006-auxiliary-receipt-validation.json

      - name: Check machine-readable contracts and boundaries
        run: |
          for report in \
            topology-validation.json \
            repository-inventory-validation.json \
            inventory-batch-chain-validation.json \
            repository-inventory-head-validation.json \
            toroidal-federation-validation.json \
            platform-assurance-pointer-validation.json \
            iso-operational-readiness-validation.json \
            claim-vocabulary-validation.json \
            claim-contradiction-ledger-validation.json \
            claim-review-chain-validation.json \
            claim-review-residual-validation.json \
            claim-discovery-precision-validation.json \
            claim-resolution-contract-validation.json \
            claim-scope-refresh-validation.json \
            g006-auxiliary-receipt-validation.json
          do
            python3 -m json.tool "$report" >/dev/null
          done

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          def read(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          reports = {
              "topology": read("topology-validation.json"),
              "inventory": read("repository-inventory-validation.json"),
              "batch_chain": read("inventory-batch-chain-validation.json"),
              "inventory_head": read("repository-inventory-head-validation.json"),
              "federation": read("toroidal-federation-validation.json"),
              "assurance": read("platform-assurance-pointer-validation.json"),
              "iso": read("iso-operational-readiness-validation.json"),
              "claim_scan": read("claim-vocabulary-validation.json"),
              "claim_ledger": read("claim-contradiction-ledger-validation.json"),
              "claim_chain": read("claim-review-chain-validation.json"),
              "claim_residual": read("claim-review-residual-validation.json"),
              "claim_precision": read("claim-discovery-precision-validation.json"),
              "claim_resolution": read("claim-resolution-contract-validation.json"),
              "scope_refresh": read("claim-scope-refresh-validation.json"),
              "auxiliary_receipt": read("g006-auxiliary-receipt-validation.json"),
          }

          assert reports["topology"]["ok"] is True
          assert all(
              report["status"] == "PASS"
              for name, report in reports.items()
              if name != "topology"
          )
          assert reports["topology"]["derived_metrics"]["cycle_count"] == 0
          assert reports["topology"]["derived_metrics"]["orphan_count"] == 0

          assert reports["inventory"]["inventory_state"] == "PARTIAL"
          assert reports["inventory"]["claim_allowed"] is False
          assert reports["batch_chain"]["all_batches_fixed_points"] is True
          assert reports["batch_chain"]["claim_allowed"] is False
          assert reports["inventory_head"]["materialized_count"] == 51
          assert reports["inventory_head"]["remaining_token_vazio"] == 75
          assert reports["inventory_head"]["claim_allowed"] is False

          assert reports["federation"]["active_count"] == 6
          assert reports["federation"]["open_evidence_gap_count"] == 1
          assert reports["federation"]["claim_allowed"] is False
          assert reports["assurance"]["open_blocking_count"] == 9
          assert reports["assurance"]["promotion_ready_count"] == 0
          assert reports["assurance"]["claim_allowed"] is False

          assert reports["iso"]["gap_priority_counts"] == {
              "P0": 8, "P1": 11, "P2": 5, "P3": 1
          }
          assert reports["iso"]["claim_allowed"] is False
          assert reports["iso"]["certification_claim"] is False

          assert reports["claim_scan"]["explicit_claim_error_count"] == 0
          assert reports["claim_scan"]["portfolio_exit_criteria_met"] is False
          assert reports["claim_scan"]["claim_allowed"] is False
          assert reports["claim_ledger"]["candidate_count"] == 36
          assert reports["claim_ledger"]["reviewed_safe_count"] == 6
          assert reports["claim_ledger"]["token_vazio_count"] == 30
          assert reports["claim_ledger"]["portfolio_exit_criteria_met"] is False

          assert reports["claim_chain"]["review_batch_count"] == 3
          assert reports["claim_chain"]["review_decision_count"] == 30
          assert reports["claim_chain"]["reviewed_safe_count"] == 36
          assert reports["claim_chain"]["reviewed_blocking_count"] == 0
          assert reports["claim_chain"]["token_vazio_count"] == 0
          assert reports["claim_chain"]["review_completion_ratio"] == 1.0
          assert reports["claim_chain"]["exact_absence_resolution_count"] == 1
          assert reports["claim_chain"]["next_gate"] == "OBSERVABLE_SCANNER_RECEIPT_AND_SCOPE_REFRESH"
          assert reports["claim_chain"]["portfolio_exit_criteria_met"] is False
          assert reports["claim_chain"]["claim_allowed"] is False
          assert reports["claim_chain"]["certification_claim"] is False

          assert reports["claim_residual"]["historical_residual_count"] == 1
          assert reports["claim_residual"]["historical_token_vazio_ids"] == ["CC028"]
          assert reports["claim_residual"]["historical_attempt_count"] == 2
          assert reports["claim_residual"]["resolved_count"] == 1
          assert reports["claim_residual"]["resolved_ids"] == ["CC028"]
          assert reports["claim_residual"]["current_residual_count"] == 0
          assert reports["claim_residual"]["current_token_vazio_ids"] == []
          assert reports["claim_residual"]["full_content_observed"] is True
          assert reports["claim_residual"]["semantic_disposition_allowed"] is True
          assert reports["claim_residual"]["decoded_size_bytes"] == 19542
          assert reports["claim_residual"]["exact_strong_token_count"] == 0
          assert reports["claim_residual"]["false_positive_source"] == "completeness_ratio"
          assert reports["claim_residual"]["portfolio_exit_criteria_met"] is False
          assert reports["claim_residual"]["claim_allowed"] is False
          assert reports["claim_residual"]["certification_claim"] is False

          assert reports["claim_precision"]["known_resolution"]["entry_id"] == "CC028"
          assert reports["claim_precision"]["known_resolution"]["false_positive_source"] == "completeness_ratio"
          assert reports["claim_precision"]["known_resolution"]["substring_complete_count"] == 1
          assert reports["claim_precision"]["known_resolution"]["exact_complete_count"] == 0
          assert reports["claim_precision"]["exact_token_files_truncated"] is False
          assert reports["claim_precision"]["portfolio_exit_criteria_met"] is False
          assert reports["claim_precision"]["claim_allowed"] is False
          assert reports["claim_precision"]["certification_claim"] is False

          assert reports["claim_resolution"]["entry_id"] == "CC028"
          assert reports["claim_resolution"]["boundary_count"] == 6
          assert reports["claim_resolution"]["all_boundaries_false"] is True
          assert reports["claim_resolution"]["decoded_size_bytes"] == 19542
          assert reports["claim_resolution"]["encoded_line_count"] == 437
          assert reports["claim_resolution"]["git_blob_sha1"] == "b43554096f00c0918997dd9f9b11787cec4d4e52"
          assert reports["claim_resolution"]["sha256"] == "b19d27084e5be35a2597f07346450745abfd7084c0a831b48e0eef4c57058e02"
          assert reports["claim_resolution"]["exact_strong_token_count"] == 0
          assert reports["claim_resolution"]["complete_substring_count"] == 1
          assert reports["claim_resolution"]["historical_residual_preserved"] is True
          assert reports["claim_resolution"]["current_token_vazio_count"] == 0
          assert reports["claim_resolution"]["portfolio_exit_criteria_met"] is False
          assert reports["claim_resolution"]["claim_allowed"] is False
          assert reports["claim_resolution"]["certification_claim"] is False

          assert re.fullmatch(r"[0-9a-f]{40}", reports["scope_refresh"]["current_scan"]["commit"])
          assert reports["scope_refresh"]["baseline"]["candidate_count"] == 36
          assert reports["scope_refresh"]["baseline"]["reviewed_safe_count"] == 36
          assert reports["scope_refresh"]["baseline"]["token_vazio_count"] == 0
          assert reports["scope_refresh"]["derived"]["new_candidate_count"] >= 0
          assert reports["scope_refresh"]["derived"]["filtered_scope_refresh_complete"] is False
          assert reports["scope_refresh"]["derived"]["full_byte_repository_scan_proven"] is False
          assert reports["scope_refresh"]["derived"]["portfolio_exit_criteria_met"] is False
          assert reports["scope_refresh"]["derived"]["claim_allowed"] is False
          assert reports["scope_refresh"]["derived"]["certification_claim"] is False
          assert reports["scope_refresh"]["boundaries"]["missing_current_signal_means_resolved"] is False
          assert reports["scope_refresh"]["boundaries"]["new_control_file_is_automatically_safe"] is False
          assert reports["scope_refresh"]["boundaries"]["filtered_scan_equals_full_scan"] is False
          assert all(
              candidate["state"] == "TOKEN_VAZIO"
              and candidate["claim_allowed"] is False
              for candidate in reports["scope_refresh"]["new_candidates"]
          )

          assert reports["auxiliary_receipt"]["compiled_file_count"] == 4
          assert reports["auxiliary_receipt"]["tests_run"] == 15
          assert reports["auxiliary_receipt"]["tests_passed"] == 15
          assert reports["auxiliary_receipt"]["file_hashes_match"] is True
          assert reports["auxiliary_receipt"]["environment_noise_preserved"] is True
          assert reports["auxiliary_receipt"]["full_repository_suite_executed"] is False
          assert reports["auxiliary_receipt"]["claim_control_plane_suite_executed"] is False
          assert reports["auxiliary_receipt"]["git_commit_bound_receipt"] is False
          assert reports["auxiliary_receipt"]["remote_runner_receipt"] is False
          assert reports["auxiliary_receipt"]["portfolio_exit_criteria_met"] is False
          assert reports["auxiliary_receipt"]["claim_allowed"] is False
          assert reports["auxiliary_receipt"]["certification_claim"] is False
          PY

      - name: Create structural checksums
        run: |
          {
            printf '%s\n' \
              indices/GRAFO_DEPENDENCIAS_MAPA.yaml \
              indices/REPOSITORY_INVENTORY.json \
              indices/REPOSITORY_INVENTORY_HEAD.json \
              indices/TOROIDAL_RESEARCH_FEDERATION.json \
              indices/PLATFORM_ASSURANCE_CONTROL_PLANE.json \
              indices/ISO_OPERATIONAL_READINESS_BASELINE.json \
              indices/CLAIM_VOCABULARY_POLICY.json \
              indices/CLAIM_CONTRADICTION_LEDGER.json \
              indices/CLAIM_CONTRADICTION_HEAD.json \
              indices/CLAIM_REVIEW_RESIDUAL.json \
              indices/CLAIM_REVIEW_RESOLUTION_CC028.json \
              schemas/repository_inventory.schema.json \
              schemas/repository_inventory_batch.schema.json \
              schemas/repository-gap-map.schema.json \
              schemas/claim-contradiction-ledger.schema.json \
              schemas/claim-review-resolution.schema.json \
              biblioteconomia/19_TOROIDAL_RESEARCH_FEDERATION.md \
              biblioteconomia/20_PLATFORM_ASSURANCE_CONTROL_PLANE.md \
              biblioteconomia/21_ISO_OPERATIONAL_READINESS_RETROFEED.md \
              biblioteconomia/22_CLAIM_VOCABULARY_AND_CONTRADICTION_GATE.md \
              docs/G006_LOCAL_EXECUTION.md \
              resultados/ISO_OPERATIONAL_READINESS_GAP_LEDGER_2026-07-20.md \
              resultados/P0_G006_CLAIM_CONTRADICTION_BASELINE_2026-07-20.md \
              resultados/G006_AUXILIARY_LOCAL_VALIDATION_2026-07-21.json \
              resultados/G006_RESOLUTION_CONTRACT_LOCAL_VALIDATION_2026-07-21.json \
              orquestrador/QUALITY_GATE_POLICY.md \
              scripts/validate_mapa_topology.py \
              scripts/validate_repository_inventory.py \
              scripts/apply_repository_inventory_batch.py \
              scripts/validate_repository_inventory_batch_chain.py \
              scripts/validate_repository_inventory_head.py \
              scripts/validate_toroidal_research_federation.py \
              scripts/validate_platform_assurance_pointer.py \
              scripts/validate_iso_operational_readiness.py \
              scripts/validate_claim_vocabulary.py \
              scripts/validate_claim_contradiction_ledger.py \
              scripts/validate_claim_review_chain.py \
              scripts/validate_claim_review_residual.py \
              scripts/validate_claim_discovery_precision.py \
              scripts/validate_claim_resolution_contract.py \
              scripts/build_claim_scope_refresh.py \
              scripts/validate_g006_auxiliary_receipt.py \
              scripts/run_g006_local_gate.py \
              tools/materialize_github_blob.py \
              tests/test_topology.py \
              tests/test_repository_inventory.py \
              tests/test_inventory_batch.py \
              tests/test_inventory_batch_chain.py \
              tests/test_inventory_head.py \
              tests/test_toroidal_research_federation.py \
              tests/test_platform_assurance_pointer.py \
              tests/test_iso_operational_readiness.py \
              tests/test_claim_vocabulary.py \
              tests/test_claim_contradiction_ledger.py \
              tests/test_claim_review_chain.py \
              tests/test_claim_review_residual.py \
              tests/test_claim_discovery_precision.py \
              tests/test_claim_resolution_contract.py \
              tests/test_claim_scope_refresh.py \
              tests/test_github_blob_materializer.py \
              tests/test_g006_local_gate.py \
              tests/test_g006_auxiliary_receipt.py \
              .github/workflows/topology-validation.yml
            find indices/inventory_batches -maxdepth 1 -type f -name '*.json' -print
            find indices/inventory_deltas -maxdepth 1 -type f -name '*.json' -print
            find indices/claim_review_batches -maxdepth 1 -type f -name '*.json' -print
          } | LC_ALL=C sort -u | xargs sha256sum > STRUCTURAL_CHECKSUMS.sha256

      - name: Upload structural audit
        uses: actions/upload-artifact@v4
        with:
          name: mapa-structural-validation
          path: |
            topology-validation.json
            repository-inventory-validation.json
            inventory-batch-chain-validation.json
            repository-inventory-head-validation.json
            toroidal-federation-validation.json
            platform-assurance-pointer-validation.json
            iso-operational-readiness-validation.json
            claim-vocabulary-validation.json
            claim-contradiction-ledger-validation.json
            claim-review-chain-validation.json
            claim-review-residual-validation.json
            claim-discovery-precision-validation.json
            claim-resolution-contract-validation.json
            claim-scope-refresh-validation.json
            g006-auxiliary-receipt-validation.json
            STRUCTURAL_CHECKSUMS.sha256
          if-no-files-found: error
          retention-days: 30
