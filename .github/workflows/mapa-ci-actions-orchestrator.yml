name: TORRE Sequential Fail-Closed

"on":
  workflow_dispatch:
    inputs:
      wait_minutes:
        description: Maximum observation time for each TORRE unit (1-30)
        required: true
        default: "15"
        type: string
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/mapa-ci-actions-orchestrator.yml"
      - ".github/workflows/vertical-slice-v1.yml"
      - "data/torre/torre-sequence.v1.json"

permissions:
  contents: read

concurrency:
  group: torre-sequential-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-sequence:
    name: Validate immutable TORRE sequence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate schema, order, and targets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("data/torre/torre-sequence.v1.json").read_text(encoding="utf-8")
          )
          expected = [
              (1, "mapa-vertical-slice", "Mapa Vertical Slice",
               "rafaelmeloreisnovo/Mapa", "vertical-slice-v1.yml", "main"),
              (2, "rafgittools-federated-runtime", "RafGitTools",
               "rafaelmeloreisnovo/RafGitTools",
               "federated-runtime-contract-v1.yml", "main"),
              (3, "rafpolimata-handoff", "RafPolimata",
               "rafaelmeloreisnovo/RafPolimata",
               "rafaelia-handoff-gate.yml", "main"),
              (4, "rafcodephi-e2e-contract", "Termux RAFCODEPHI",
               "rafaelmeloreisnovo/termux-app-rafacodephi",
               "rafaelia_e2e_product_proof.yml", "master"),
          ]
          observed = [
              (
                  unit.get("order"), unit.get("id"), unit.get("label"),
                  unit.get("repository"), unit.get("workflow"), unit.get("ref"),
              )
              for unit in data.get("units", [])
          ]
          if data.get("schema") != "rafaelia.torre.sequence/v1":
              raise SystemExit("invalid TORRE schema")
          if data.get("claim_allowed") is not False:
              raise SystemExit("claim_allowed must remain false")
          if data.get("automatic_merge") is not False:
              raise SystemExit("automatic_merge must remain false")
          if observed != expected:
              raise SystemExit("TORRE sequence differs from reviewed immutable targets")
          print(json.dumps({
              "decision": "PASS",
              "units": len(observed),
              "claim_allowed": False,
              "automatic_merge": False,
          }, sort_keys=True))
          PY

  execute-sequence:
    name: Execute TORRE units one at a time
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-sequence
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ secrets.TORRE_ORCHESTRATOR_TOKEN }}
      WAIT_MINUTES: ${{ inputs.wait_minutes }}
    steps:
      - name: Checkout controller definition
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Dispatch and observe units sequentially
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          base = Path("build/torre")
          snapshots = base / "snapshots"
          base.mkdir(parents=True, exist_ok=True)
          snapshots.mkdir(parents=True, exist_ok=True)
          events = []
          terminal_error = None

          def emit(unit, state, correlation_id, detail="", run=None):
              event = {
                  "observed_at": datetime.now(timezone.utc).isoformat(),
                  "order": unit.get("order"),
                  "unit_id": unit.get("id"),
                  "repository": unit.get("repository"),
                  "workflow": unit.get("workflow"),
                  "ref": unit.get("ref"),
                  "correlation_id": correlation_id,
                  "state": state,
                  "detail": detail,
                  "run_id": None if run is None else run.get("id"),
                  "conclusion": None if run is None else run.get("conclusion"),
                  "run_url": None if run is None else run.get("html_url"),
              }
              events.append(event)
              print(json.dumps(event, sort_keys=True), flush=True)

          def api(*args):
              result = subprocess.run(
                  ["gh", "api", *args],
                  text=True,
                  capture_output=True,
                  check=False,
              )
              if result.returncode != 0:
                  detail = (result.stderr or result.stdout).replace("\n", " ")[:1200]
                  raise RuntimeError(detail or "gh api returned a nonzero exit status")
              return result.stdout

          try:
              wait_minutes = os.environ.get("WAIT_MINUTES", "")
              if not wait_minutes.isdigit() or not 1 <= int(wait_minutes) <= 30:
                  raise RuntimeError("wait_minutes must be an integer between 1 and 30")
              if not os.environ.get("GH_TOKEN"):
                  raise RuntimeError(
                      "TOKEN_VAZIO_TORRE_ORCHESTRATOR_TOKEN: secret is required"
                  )
              api("user", "--jq", ".login")

              data = json.loads(
                  Path("data/torre/torre-sequence.v1.json").read_text(encoding="utf-8")
              )
              for unit in data["units"]:
                  order = unit["order"]
                  correlation_id = f"torre-{os.environ['GITHUB_RUN_ID']}-{order}"
                  expected_title = f"TORRE / {unit['label']} / {correlation_id}"
                  emit(unit, "DISPATCHING", correlation_id)

                  try:
                      api(
                          "--method", "POST",
                          f"repos/{unit['repository']}/actions/workflows/{unit['workflow']}/dispatches",
                          "-f", f"ref={unit['ref']}",
                          "-f", f"inputs[torre_correlation_id]={correlation_id}",
                      )
                  except RuntimeError as exc:
                      emit(unit, "DISPATCH_REJECTED", correlation_id, str(exc))
                      raise RuntimeError(
                          f"first blocked unit is {unit['id']}; later units were not started"
                      ) from exc

                  deadline = time.monotonic() + int(wait_minutes) * 60
                  while True:
                      raw = api(
                          "--method", "GET",
                          f"repos/{unit['repository']}/actions/workflows/{unit['workflow']}/runs"
                          f"?event=workflow_dispatch&branch={unit['ref']}&per_page=100",
                      )
                      (snapshots / f"{order}.json").write_text(raw, encoding="utf-8")
                      runs = json.loads(raw).get("workflow_runs", [])
                      matches = [
                          run for run in runs
                          if run.get("display_title") == expected_title
                      ]
                      matches.sort(key=lambda run: run.get("created_at", ""), reverse=True)
                      run = matches[0] if matches else None

                      if run and run.get("status") == "completed":
                          if run.get("conclusion") == "success":
                              emit(unit, "PASS", correlation_id, run=run)
                              break
                          emit(
                              unit, "RED", correlation_id,
                              "Child workflow completed without success.", run,
                          )
                          raise RuntimeError(
                              f"first red unit is {unit['id']}; later units were not started"
                          )

                      if time.monotonic() >= deadline:
                          state = "TOKEN_VAZIO_NOT_COMPLETED" if run else "TOKEN_VAZIO_RUN_ID"
                          detail = (
                              "Observation window elapsed before completion."
                              if run else
                              "No correlated workflow run became observable."
                          )
                          emit(unit, state, correlation_id, detail, run)
                          raise RuntimeError(
                              f"first unresolved unit is {unit['id']}; later units were not started"
                          )
                      time.sleep(10)
          except RuntimeError as exc:
              terminal_error = str(exc)
              print(f"FAIL: {terminal_error}", file=sys.stderr)
          finally:
              terminal = [event for event in events if event["state"] != "DISPATCHING"]
              failures = [event for event in terminal if event["state"] != "PASS"]
              receipt = {
                  "schema": "rafaelia.torre-receipt/v1",
                  "generated_at": datetime.now(timezone.utc).isoformat(),
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "controller_run_id": os.environ["GITHUB_RUN_ID"],
                  "claim_allowed": False,
                  "automatic_merge": False,
                  "decision": "PASS" if terminal_error is None else "BLOCKED",
                  "terminal_counts": dict(
                      sorted(Counter(event["state"] for event in terminal).items())
                  ),
                  "events": events,
                  "r3": {
                      "F_ok": f"{sum(event['state'] == 'PASS' for event in terminal)} units passed",
                      "F_gap": f"{len(failures)} red or unresolved unit(s)",
                      "F_next": "Repair the first non-PASS unit before any later dispatch.",
                  },
              }
              (base / "events.json").write_text(
                  json.dumps(events, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              (base / "receipt.json").write_text(
                  json.dumps(receipt, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
                  out.write("## TORRE sequential receipt\n\n")
                  out.write(f"Decision: {receipt['decision']}\n\n")
                  out.write(f"Terminal states: {receipt['terminal_counts']}\n\n")
                  out.write("Claim allowed: false\n\n")
                  out.write("Automatic merge: false\n\n")
                  out.write("Rule: first non-PASS unit blocks all later units.\n")
          if terminal_error is not None:
              raise SystemExit(1)
          PY

      - name: Upload bounded TORRE evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: torre-sequential-${{ github.run_id }}
          path: build/torre/
          if-no-files-found: error
          retention-days: 30
