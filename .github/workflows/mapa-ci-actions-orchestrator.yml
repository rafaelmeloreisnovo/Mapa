name: TORRE Sequential Fail-Closed

run-name: "TORRE / ${{ github.event_name }} / ${{ github.run_id }}"

"on":
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/mapa-ci-actions-orchestrator.yml"
      - ".github/workflows/vertical-slice-v1.yml"
      - "data/torre/torre-sequence.v1.json"

permissions:
  contents: read

concurrency:
  group: torre-sequential-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate_sequence:
    name: Validate immutable TORRE sequence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate declared immutable workflow sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("data/torre/torre-sequence.v1.json").read_text(encoding="utf-8")
          )
          expected = [
              (1, "mapa-vertical-slice", "Mapa Vertical Slice",
               "rafaelmeloreisnovo/Mapa",
               ".github/workflows/vertical-slice-v1.yml",
               "16de299f36c814d1a95d36fa1e3fbd6af4f05e97"),
              (2, "rafgittools-federated-runtime", "RafGitTools",
               "rafaelmeloreisnovo/RafGitTools",
               ".github/workflows/federated-runtime-contract-v1.yml",
               "09833d0f7f398109f1c4c2075173ad3a994dd683"),
              (3, "rafpolimata-handoff", "RafPolimata",
               "rafaelmeloreisnovo/RafPolimata",
               ".github/workflows/rafaelia-handoff-gate.yml",
               "976a8e313c3d88ed648e9576167bd223b9391f44"),
              (4, "rafcodephi-e2e-contract", "Termux RAFCODEPHI",
               "rafaelmeloreisnovo/termux-app-rafacodephi",
               ".github/workflows/rafaelia_e2e_product_proof.yml",
               "bd75bfacbe701c5eaf8dea33265c6129ec68ece0"),
          ]
          observed = [
              (
                  unit.get("order"), unit.get("id"), unit.get("label"),
                  unit.get("repository"), unit.get("workflow"), unit.get("commit"),
              )
              for unit in data.get("units", [])
          ]
          if data.get("schema") != "rafaelia.torre.reusable-sequence/v2":
              raise SystemExit("invalid TORRE schema")
          if data.get("claim_allowed") is not False:
              raise SystemExit("claim_allowed must remain false")
          if data.get("automatic_merge") is not False:
              raise SystemExit("automatic_merge must remain false")
          if data.get("state") != "DRAFT_SOURCE_LOCKED":
              raise SystemExit("TORRE state must remain DRAFT_SOURCE_LOCKED")
          if data.get("promotion") != "BLOCKED":
              raise SystemExit("TORRE promotion must remain BLOCKED")
          expected_resolution = {
              "mapa": "21baebae22508350f693da0c2d9927417b1ded7d",
              "rafgittools": "09833d0f7f398109f1c4c2075173ad3a994dd683",
              "rafpolimata": "TOKEN_VAZIO_MERGE_COMMIT_SHA",
              "rafcodephi": "TOKEN_VAZIO_MERGE_COMMIT_SHA",
          }
          if data.get("promotion_ref_resolution") != expected_resolution:
              raise SystemExit("default-branch merge SHA resolution must remain explicit")
          if data.get("private_workflow_access", {}).get("required") is not True:
              raise SystemExit("private reusable-workflow access must remain explicit")
          if observed != expected:
              raise SystemExit("TORRE sequence differs from reviewed immutable sources")
          print(json.dumps({
              "decision": "PASS",
              "units": len(observed),
              "claim_allowed": False,
              "automatic_merge": False,
          }, sort_keys=True))
          PY

  execution_gate:
    name: Block manual execution until source promotion is reconciled
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate_sequence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout promotion manifest
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Enforce promotion boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("data/torre/torre-sequence.v1.json").read_text(encoding="utf-8")
          )
          if data.get("promotion") != "READY":
              raise SystemExit(
                  "TORRE manual execution is BLOCKED until all default-branch "
                  "merge SHAs are observed and reviewed."
              )
          PY

  mapa_vertical_slice:
    name: "01 Mapa — Vertical Slice"
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: execution_gate
    uses: ./.github/workflows/vertical-slice-v1.yml
    with:
      torre_correlation_id: "torre-${{ github.run_id }}-01"

  rafgittools_federated_runtime:
    name: "02 RafGitTools — Federated Runtime"
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: mapa_vertical_slice
    uses: rafaelmeloreisnovo/RafGitTools/.github/workflows/federated-runtime-contract-v1.yml@09833d0f7f398109f1c4c2075173ad3a994dd683
    with:
      torre_correlation_id: "torre-${{ github.run_id }}-02"

  rafpolimata_handoff:
    name: "03 RafPolimata — Handoff Gate"
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: rafgittools_federated_runtime
    uses: rafaelmeloreisnovo/RafPolimata/.github/workflows/rafaelia-handoff-gate.yml@976a8e313c3d88ed648e9576167bd223b9391f44
    with:
      torre_correlation_id: "torre-${{ github.run_id }}-03"

  rafcodephi_e2e_contract:
    name: "04 Termux RAFCODEPHI — E2E Contract"
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: rafpolimata_handoff
    uses: rafaelmeloreisnovo/termux-app-rafacodephi/.github/workflows/rafaelia_e2e_product_proof.yml@bd75bfacbe701c5eaf8dea33265c6129ec68ece0
    with:
      torre_correlation_id: "torre-${{ github.run_id }}-04"

  write_receipt:
    name: Write bounded TORRE receipt
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs:
      - validate_sequence
      - execution_gate
      - mapa_vertical_slice
      - rafgittools_federated_runtime
      - rafpolimata_handoff
      - rafcodephi_e2e_contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VALIDATION_RESULT: ${{ needs.validate_sequence.result }}
      EXECUTION_GATE_RESULT: ${{ needs.execution_gate.result }}
      MAPA_RESULT: ${{ needs.mapa_vertical_slice.result }}
      RAFGITTOOLS_RESULT: ${{ needs.rafgittools_federated_runtime.result }}
      RAFPOLIMATA_RESULT: ${{ needs.rafpolimata_handoff.result }}
      RAFCODEPHI_RESULT: ${{ needs.rafcodephi_e2e_contract.result }}
    steps:
      - name: Emit result-only receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/torre
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          order = [
              ("validate_sequence", os.environ["VALIDATION_RESULT"]),
              ("execution_gate", os.environ["EXECUTION_GATE_RESULT"]),
              ("mapa_vertical_slice", os.environ["MAPA_RESULT"]),
              ("rafgittools_federated_runtime", os.environ["RAFGITTOOLS_RESULT"]),
              ("rafpolimata_handoff", os.environ["RAFPOLIMATA_RESULT"]),
              ("rafcodephi_e2e_contract", os.environ["RAFCODEPHI_RESULT"]),
          ]
          first_non_success = next(
              (name for name, result in order if result != "success"),
              None,
          )
          receipt = {
              "schema": "rafaelia.torre-reusable-receipt/v1",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "claim_allowed": False,
              "automatic_merge": False,
              "result_by_unit": dict(order),
              "decision": "PASS" if first_non_success is None else "BLOCKED",
              "first_non_success": first_non_success,
              "r3": {
                  "F_ok": "A later unit is callable only after its direct dependency succeeds.",
                  "F_gap": (
                      "none" if first_non_success is None else
                      f"first non-success unit: {first_non_success}"
                  ),
                  "F_next": (
                      "Observe the immutable run receipt before promotion."
                      if first_non_success is None else
                      f"Repair {first_non_success}; downstream units were not invoked."
                  ),
              },
          }
          Path("build/torre/receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Upload bounded TORRE receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: torre-reusable-receipt-${{ github.run_id }}
          path: build/torre/receipt.json
          if-no-files-found: error
          retention-days: 30
