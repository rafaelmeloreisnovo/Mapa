name: CI

"on":
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Repository Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Parse every GitHub Actions YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby - <<'RUBY'
          require "psych"

          files = Dir[".github/workflows/*.{yml,yaml}"].sort
          abort "No workflow YAML files found" if files.empty?

          files.each do |path|
            Psych.parse_file(path)
            puts "OK: #{path}"
          end
          puts "Parsed #{files.length} workflow YAML files."
          RUBY

      - name: Install markdownlint
        run: npm install -g markdownlint-cli2

      - name: Lint changed Markdown — blocking regression gate
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git cat-file -e "$base^{commit}"
            range="$base...HEAD"
          else
            before="${{ github.event.before }}"
            zero="0000000000000000000000000000000000000000"
            if [ -z "$before" ] || [ "$before" = "$zero" ] || \
               ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              base="HEAD^"
            else
              base="$before"
            fi
            range="$base..HEAD"
          fi

          mapfile -t markdown_files < <(
            git diff --name-only --diff-filter=ACMR "$range" -- '*.md'
          )

          if [ "${#markdown_files[@]}" -eq 0 ]; then
            echo "OK: no Markdown files changed in $range"
            exit 0
          fi

          printf 'Markdown regression gate (%s):\n' "$range"
          printf '  %s\n' "${markdown_files[@]}"
          markdownlint-cli2 --no-globs "${markdown_files[@]}"

      - name: Historical Markdown debt report — non-blocking
        continue-on-error: true
        run: markdownlint-cli2 "**/*.md" "#node_modules"

      - name: Check required root files
        run: |
          for f in README.md CONTRIBUTING.md CHANGELOG.md CODE_OF_CONDUCT.md LICENSE; do
            [ -f "$f" ] || { echo "Missing: $f"; exit 1; }
          done
          echo "All required root files present."

      - name: Structure guard — only exact custodied Genesis Seal may remain at root
        shell: bash
        run: |
          set -euo pipefail
          allowed="./file_000000002e20820ebc7eb4567c469138.png"
          expected_blob="b9d3af394b3f32601c51debf285ee1f627343f14"
          expected_size="3160622"

          mapfile -t loose < <(find . -maxdepth 1 -type f -name 'file_*.png' -print | sort)

          for path in "${loose[@]}"; do
            if [ "$path" != "$allowed" ]; then
              echo "ERROR: unapproved hash-named PNG at root: $path"
              exit 1
            fi

            blob=$(git hash-object "$path")
            size=$(wc -c < "$path" | tr -d '[:space:]')
            if [ "$blob" != "$expected_blob" ]; then
              echo "ERROR: Genesis Seal blob drift: expected $expected_blob got $blob"
              exit 1
            fi
            if [ "$size" != "$expected_size" ]; then
              echo "ERROR: Genesis Seal size drift: expected $expected_size got $size"
              exit 1
            fi
            echo "PASS: exact custodied Genesis Seal retained at root ($blob, $size bytes)"
          done

          if [ "${#loose[@]}" -eq 0 ]; then
            echo "PASS: no hash-named PNGs at root"
          fi

      - name: M3 — Varredura operacional contract check
        run: |
          wf="workflows/WORKFLOW_VARREDURA_OPERACIONAL.md"
          [ -f "$wf" ] || { echo "MISSING: $wf"; exit 1; }
          required=("id" "origem" "tipo" "estado" "ação" "resultado")
          for field in "${required[@]}"; do
            grep -q "$field" "$wf" || { echo "MISSING field '$field' in $wf"; exit 1; }
          done
          echo "OK: Varredura operacional contract fields present."

      - name: Temporal gap routing anti-regression
        run: python3 tools/validate_temporal_priority_queue.py

      - name: M2 — Auto index generation
        run: |
          python3 scripts/generate_asset_index.py --out indices/ASSET_INDEX_AUTO.yaml
          count=$(python3 -c "import re; data=open('indices/ASSET_INDEX_AUTO.yaml').read(); m=re.search(r'total_files: (\\d+)', data); print(m.group(1))")
          [ "$count" -ge 1 ] || { echo "FAIL: index generated zero files"; exit 1; }
          echo "OK: auto index generated $count files"

      - name: M4 — Internal repo link verification
        run: |
          python3 - <<'EOF'
          import pathlib
          import re

          in_scope = {
              "rafaelmeloreisnovo/Mapa",
              "rafaelmeloreisnovo/Vectras-VM-Android",
              "rafaelmeloreisnovo/qemu_rafaelia",
              "rafaelmeloreisnovo/termux-app-rafacodephi",
              "rafaelmeloreisnovo/RafGitTools",
              "rafaelmeloreisnovo/androidx_RmR",
          }
          repo_pattern = re.compile(r"rafaelmeloreisnovo/([A-Za-z0-9_\-.]+)")
          out_of_scope = set()
          for markdown in pathlib.Path(".").rglob("*.md"):
              if ".git" in markdown.parts or "node_modules" in markdown.parts:
                  continue
              text = markdown.read_text(errors="replace")
              for match in repo_pattern.finditer(text):
                  reference = f"rafaelmeloreisnovo/{match.group(1)}"
                  if reference not in in_scope:
                      out_of_scope.add(reference)
          if out_of_scope:
              print("INFO: References to out-of-scope repos (manual verification required):")
              for reference in sorted(out_of_scope):
                  print(f"  {reference}")
          else:
              print("OK: All repo references are within active scope.")
          EOF
