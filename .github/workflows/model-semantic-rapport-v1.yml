name: Model Semantic Rapport V1

"on":
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "contracts/model-semantic-rapport.v1.json"
      - "schemas/model-semantic-rapport.v1.schema.json"
      - "examples/model-semantic-rapport.closed-provider.v1.json"
      - "tools/validate_model_semantic_rapport.py"
      - "tests/test_model_semantic_rapport.py"
      - "docs/architecture/MODEL_SEMANTIC_CONTEXT_RAPPORT_V1.md"
      - "navigation/MODEL_SEMANTIC_RAPPORT_V1.md"
      - "contracts/contextual-semantic-packet.v1.json"
      - "docs/CONTEXTUAL_SEMANTIC_EXECUTION_PROTOCOL_V1.md"
      - "docs/GPT_LAYOUT_WORKFLOWS_V1.md"
      - "governance/GPT_LAYOUT_WORKFLOW_V1.json"
      - "navigation/GPT_LAYOUT_WORKFLOWS_V1.md"
      - "data/audits/TOKEN_VAZIO_REGISTRY.jsonl"
      - ".github/workflows/model-semantic-rapport-v1.yml"

permissions:
  contents: read

concurrency:
  group: model-semantic-rapport-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: model-semantic-rapport / fail-closed
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Parse machine artifacts
        run: |
          python3 -m json.tool contracts/model-semantic-rapport.v1.json >/dev/null
          python3 -m json.tool schemas/model-semantic-rapport.v1.schema.json >/dev/null
          python3 -m json.tool examples/model-semantic-rapport.closed-provider.v1.json >/dev/null

      - name: Validate closed-provider boundary
        run: |
          python3 tools/validate_model_semantic_rapport.py \
            --report artifacts/model-semantic-rapport/validation.json

      - name: Run positive and negative tests
        run: python3 -m unittest -v tests.test_model_semantic_rapport

      - name: Verify receipt ceiling
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("artifacts/model-semantic-rapport/validation.json")
              .read_text(encoding="utf-8")
          )
          assert report["status"] == "PASS"
          assert report["claim_allowed"] is False
          assert report["model_internal_claim_allowed"] is False
          assert report["internal_access"] == "PROPRIETARY_WITHHELD"
          assert report["parameter_update_observed"] is None
          assert report["blocking_gap_count"] >= 1
          PY

      - name: Upload structural receipt when quota permits
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-semantic-rapport-${{ github.run_id }}
          path: artifacts/model-semantic-rapport/validation.json
          if-no-files-found: error
          retention-days: 30

      - name: Record evidence boundary
        if: always()
        shell: bash
        run: |
          test -s artifacts/model-semantic-rapport/validation.json
          {
            echo "## Model Semantic Rapport V1"
            echo
            echo "- Structural receipt: present"
            echo "- Artifact upload outcome: \`${{ steps.upload.outcome }}\`"
            echo "- Model internals observed: no"
            echo "- Parameter update observed: TOKEN_VAZIO"
            echo "- claim_allowed: false"
            if [ "${{ steps.upload.outcome }}" != "success" ]; then
              echo "- Artifact storage: TOKEN_VAZIO_GITHUB_ARTIFACT_QUOTA"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
