name: Cross-Source Record Validation

on:
  pull_request:
    paths:
      - "arquitetura/00_ARQUITETURA_RELACIONAL_GITHUB_DRIVE_MEMORIA.md"
      - "schemas/cross-source-record.schema.json"
      - "schemas/directive-event.schema.json"
      - "indices/CROSS_SOURCE_REGISTRY.jsonl"
      - "indices/DIRECTIVE_EVENTS_INDEX_V1.md"
      - "indices/RAFAELIA_IMPLEMENTACAO_LATENTES_PAPERS_V1.md"
      - "data/directives/**"
      - "indices/CROSS_SOURCE_GATE_FLOOR.json"
      - "indices/CADEIA_CUSTODIA_EVENTOS.jsonl"
      - "scripts/validate_cross_source_records.py"
      - "scripts/validate_directive_events.py"
      - "scripts/validate_cross_source_registry.py"
      - "scripts/validate_chain_of_custody.py"
      - "scripts/run_cross_source_tests.py"
      - "scripts/evaluate_cross_source_gate.py"
      - "scripts/compare_cross_source_evidence.py"
      - "scripts/run_cross_source_gate.sh"
      - "tests/test_cross_source_records.py"
      - "tests/test_cross_source_registry.py"
      - "tests/directives/**"
      - "tests/test_cross_source_local_gate_contract.py"
      - "tests/test_cross_source_gate_evaluator.py"
      - "tests/test_cross_source_test_runner.py"
      - "tests/test_compare_cross_source_evidence.py"
      - "tests/test_validate_chain_of_custody.py"
      - "tests/fixtures/cross_source/**"
      - ".github/workflows/cross-source-record-validation.yml"
  push:
    branches: [main]
    paths:
      - "arquitetura/00_ARQUITETURA_RELACIONAL_GITHUB_DRIVE_MEMORIA.md"
      - "schemas/cross-source-record.schema.json"
      - "schemas/directive-event.schema.json"
      - "indices/CROSS_SOURCE_REGISTRY.jsonl"
      - "indices/DIRECTIVE_EVENTS_INDEX_V1.md"
      - "indices/RAFAELIA_IMPLEMENTACAO_LATENTES_PAPERS_V1.md"
      - "data/directives/**"
      - "indices/CROSS_SOURCE_GATE_FLOOR.json"
      - "indices/CADEIA_CUSTODIA_EVENTOS.jsonl"
      - "scripts/validate_cross_source_records.py"
      - "scripts/validate_directive_events.py"
      - "scripts/validate_cross_source_registry.py"
      - "scripts/validate_chain_of_custody.py"
      - "scripts/run_cross_source_tests.py"
      - "scripts/evaluate_cross_source_gate.py"
      - "scripts/compare_cross_source_evidence.py"
      - "scripts/run_cross_source_gate.sh"
      - "tests/test_cross_source_records.py"
      - "tests/test_cross_source_registry.py"
      - "tests/directives/**"
      - "tests/test_cross_source_local_gate_contract.py"
      - "tests/test_cross_source_gate_evaluator.py"
      - "tests/test_cross_source_test_runner.py"
      - "tests/test_compare_cross_source_evidence.py"
      - "tests/test_validate_chain_of_custody.py"
      - "tests/fixtures/cross_source/**"
      - ".github/workflows/cross-source-record-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-source-record-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Run canonical offline gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Execute the same gate used by Termux
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/run_cross_source_gate.sh "$RUNNER_TEMP/cross-source-local"

      - name: Verify sealed evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path

          repository = Path.cwd()
          root = Path(os.environ["RUNNER_TEMP"]) / "cross-source-local"
          floor_path = repository / "indices" / "CROSS_SOURCE_GATE_FLOOR.json"
          comparator_path = repository / "scripts" / "compare_cross_source_evidence.py"
          spec = importlib.util.spec_from_file_location(
              "cross_source_evidence_comparator",
              comparator_path,
          )
          assert spec and spec.loader
          comparator = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(comparator)

          bundle = comparator.validate_bundle(root, floor_path)
          assert bundle["status"] == "PASS", bundle["defects"]

          manifest = json.loads(
              (root / "LOCAL_GATE_STATUS.json").read_text(encoding="utf-8")
          )
          registry = json.loads(
              (root / "cross-source-registry-validation.json").read_text(
                  encoding="utf-8"
              )
          )
          assert manifest["schema_version"] == "rafaelia.cross-source-local-gate/v3"
          assert manifest["status"] == "PASS"
          assert manifest["test_file_count"] >= manifest["minimum_test_file_count"]
          assert manifest["test_count_discovered"] >= manifest["minimum_test_count"]
          assert manifest["test_count_observed"] >= manifest["minimum_test_count"]
          assert manifest["test_count_observed"] == manifest["test_count_discovered"]
          assert manifest["complete_test_execution"] is True
          assert manifest["clean_test_outcomes"] is True
          assert manifest["report_count"] == 5
          assert manifest["quality_floor"]["schema_version"] == "rafaelia.cross-source-gate-floor/v2"
          assert manifest["quality_floor"]["sha256"] == comparator.sha256_file(floor_path)
          assert manifest["quality_floor_status"] == "PASS"
          assert manifest["promotion_state"] == "LOCAL_PASS_REMOTE_TOKEN_VAZIO"
          assert manifest["claim_allowed"] is False
          assert manifest["remote_ci_substituted"] is False
          assert registry["registry"] == "indices/CROSS_SOURCE_REGISTRY.jsonl"
          PY

      - name: Validate scoped non-retroactive directive events
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            -s tests/directives \
            -p 'test_directive_events.py' \
            -v
          python3 scripts/validate_directive_events.py \
            --events data/directives/directive_events.20260803.jsonl \
            --report "$RUNNER_TEMP/cross-source-local/directive-event-validation.json"

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: cross-source-validation
          path: ${{ runner.temp }}/cross-source-local/
          if-no-files-found: error
          retention-days: 14
