name: Audit Readiness R1-R10

"on":
  pull_request:
    paths:
      - 'data/governance/AUDIT_READINESS_R1_R10_20260831.v1.json'
      - 'data/reconciliation/OMEGA_PROVIDER_STATE_R76_20260831.v1.json'
      - '.github/workflows/audit-readiness-r1-r10.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate R1-R10 profile with pinned RafGitTools action
        uses: rafaelmeloreisnovo/RafGitTools/.github/actions/audit-readiness-r1-r10@5285a096f759a3c30cf3ef2a8943a6340dd24188
        with:
          profile: data/governance/AUDIT_READINESS_R1_R10_20260831.v1.json

      - name: Validate R76 provider-state semantics
        run: |
          python3 - <<'PY'
          import json
          p='data/reconciliation/OMEGA_PROVIDER_STATE_R76_20260831.v1.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['claim_allowed'] is False
          assert d['state']=='OBSERVED_COMPLETED_STARTUP_FAILURE'
          assert d['mapa']['protected'] is False
          assert d['mapa']['required_status_checks_enforcement']=='off'
          runs=d['producer_runs']
          assert len(runs)==2
          for r in runs:
              assert r['conclusion']=='failure'
              assert r['steps_count']==0
              assert r['runner_id']==0
              assert r['classification']=='EXECUTOR_NOT_STARTED_OBSERVED'
              assert r['code_failure_evidenced'] is False
          assert d['cross_repo_assessment']['root_cause_proven'] is False
          print('R76_PROVIDER_STATE_VALID')
          PY

      - name: Expose evidence boundary
        run: |
          echo 'AUDIT_READINESS=BOUNDED_ONLY'
          echo 'SERVER_SIDE_ENFORCEMENT=BLOCKED_OBSERVED'
          echo 'RUNNER_ROOT_CAUSE=TOKEN_VAZIO'
          echo 'CERTIFICATION=false'
          echo 'CLAIM_ALLOWED=false'
