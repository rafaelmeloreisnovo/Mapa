name: novoexport-raw018-wave4-evolution-x

on:
  pull_request:
    paths:
      - 'data/evidence/novoexport_raw018_wave4_evolution_x_20260825.v1.json'
      - 'data/evidence/novoexport_raw018_wave4_source_listing_reconciliation_20260825.v1.json'
      - 'tools/validate_novoexport_raw018_wave4_evolution_x.py'
      - 'tools/validate_novoexport_raw018_wave4_source_listing.py'
      - '.github/workflows/novoexport-raw018-wave4-evolution-x.yml'
      - 'indices/NOVOEXPORT_RAW018_WAVE4_EVOLUTION_X_20260825_V1.md'
      - 'indices/NOVOEXPORT_RAW018_WAVE4_SOURCE_LISTING_RECONCILIATION_20260825_V1.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pinned commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile validators
        run: |
          python3 -m py_compile tools/validate_novoexport_raw018_wave4_evolution_x.py
          python3 -m py_compile tools/validate_novoexport_raw018_wave4_source_listing.py
      - name: Validate raw018 G2 evolution and hard-custody gaps
        run: python3 tools/validate_novoexport_raw018_wave4_evolution_x.py
      - name: Validate historical source-listing reconciliation
        run: python3 tools/validate_novoexport_raw018_wave4_source_listing.py
