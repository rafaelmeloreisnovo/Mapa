name: Custody Types V1
on:
  pull_request:
    paths:
      - 'data/governance/custody/**'
      - 'data/control-plane/CUSTODY_CHAIN_TYPE_REGISTRY.v1.json'
      - 'schemas/custody-chain-type-registry.schema.json'
      - 'docs/governance/CUSTODY_MODEL_V1.md'
      - 'schemas/custody_event_v1.schema.json'
      - 'tools/validate_custody_types_v1.py'
      - 'tests/test_custody_types_v1.py'
      - '.github/workflows/custody-types-v1.yml'
  push:
    paths:
      - 'data/governance/custody/**'
      - 'data/control-plane/CUSTODY_CHAIN_TYPE_REGISTRY.v1.json'
      - 'schemas/custody-chain-type-registry.schema.json'
      - 'docs/governance/CUSTODY_MODEL_V1.md'
      - 'schemas/custody_event_v1.schema.json'
      - 'tools/validate_custody_types_v1.py'
      - 'tests/test_custody_types_v1.py'
      - '.github/workflows/custody-types-v1.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python tools/validate_custody_types_v1.py --event data/governance/custody/07_EVIDENCE/custody_refactor_v1.sample_event.json
      - run: python -m unittest tests/test_custody_types_v1.py
