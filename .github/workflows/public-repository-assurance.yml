name: Public Repository Assurance

on:
  push:
    paths:
      - 'data/control-plane/PUBLIC_REPOSITORY_ASSURANCE_MATRIX_V1.json'
      - 'docs/PUBLIC_REPOSITORY_ASSURANCE_V1.md'
      - 'scripts/validate_public_repository_assurance.py'
      - '.github/workflows/public-repository-assurance.yml'
  pull_request:
    paths:
      - 'data/control-plane/PUBLIC_REPOSITORY_ASSURANCE_MATRIX_V1.json'
      - 'docs/PUBLIC_REPOSITORY_ASSURANCE_V1.md'
      - 'scripts/validate_public_repository_assurance.py'
      - '.github/workflows/public-repository-assurance.yml'

permissions:
  contents: read

jobs:
  assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate public repository assurance matrix
        run: python3 scripts/validate_public_repository_assurance.py
      - name: Negative gate — claim_allowed must fail closed
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/control-plane/PUBLIC_REPOSITORY_ASSURANCE_MATRIX_V1.json')
          original = p.read_text(encoding='utf-8')
          data = json.loads(original)
          data['claim_allowed'] = True
          p.write_text(json.dumps(data), encoding='utf-8')
          PY
          if python3 scripts/validate_public_repository_assurance.py; then
            echo 'FAIL: validator accepted claim_allowed=true' >&2
            exit 1
          fi
          git checkout -- data/control-plane/PUBLIC_REPOSITORY_ASSURANCE_MATRIX_V1.json
          python3 scripts/validate_public_repository_assurance.py
