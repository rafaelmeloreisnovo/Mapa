name: Repository Gap Map

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/repository_gap_mapper.py"
      - "tests/test_repository_gap_mapper.py"
      - "schemas/repository-gap-map.schema.json"
      - "docs/REPOSITORY_GAP_MAPPER.md"
      - ".github/workflows/repository-gap-map.yml"
  push:
    branches: [main]
    paths:
      - "tools/repository_gap_mapper.py"
      - "tests/test_repository_gap_mapper.py"
      - "schemas/repository-gap-map.schema.json"
      - "docs/REPOSITORY_GAP_MAPPER.md"
      - ".github/workflows/repository-gap-map.yml"

permissions:
  contents: read

concurrency:
  group: repository-gap-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-map:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@b4ffde65f46336ab88eb53b2ddc3a3808b9a7055

      - name: Set up Python
        uses: actions/setup-python@f677139bbe7f9c59030f3aa62b693246ab674ec9
        with:
          python-version: "3.12"

      - name: Compile scanner
        run: python -m py_compile tools/repository_gap_mapper.py

      - name: Run unit tests
        run: python -m unittest -v tests/test_repository_gap_mapper.py

      - name: Generate self-map
        run: |
          mkdir -p generated
          python tools/repository_gap_mapper.py \
            --root Mapa=. \
            --exclude generated \
            --output-json generated/REPOSITORY_GAP_MAP.json \
            --output-md generated/REPOSITORY_GAP_MAP.md \
            --fail-on none

      - name: Upload map evidence
        if: always()
        uses: actions/upload-artifact@c7d193f32eddeaeca500a8efe53f51ff053605ad
        with:
          name: repository-gap-map-${{ github.sha }}
          path: generated/
          if-no-files-found: error
          retention-days: 30
