# Sample workflow for building and deploying a Jekyll site to GitHub Pages
#
# Non-authoritative alternative producer.
# Automatic publication authority is bound in
# data/control-plane/PAGES_PUBLICATION_AUTHORITY.v1.json.
# This workflow is preserved for explicit/manual experiments only.
# NOTE: tag-pinned Actions in this sample remain incompatible with the current
# repository full-SHA pinning policy; a manual run is therefore experimental.
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Manual-only by governance: do not compete with the authoritative auto-producer.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
