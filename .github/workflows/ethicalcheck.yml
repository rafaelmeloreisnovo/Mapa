# External API scanners are useful only after target authorization, supplier review,
# data-egress review, and immutable dependency pinning are evidenced.
#
# This workflow is intentionally quarantined. It performs no outbound scan and grants
# no write permission. Reactivation requires an explicit, reviewed PR with evidence.
name: EthicalCheck — quarantined external scanner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantine:
    name: External scanner quarantine receipt
    runs-on: ubuntu-latest
    steps:
      - name: Record fail-safe state
        shell: bash
        run: |
          set -euo pipefail
          cat <<'EOF'
          EthicalCheck external execution is QUARANTINED.

          Required before reactivation:
          - authorized target and scope are evidenced;
          - HTTPS endpoint is used;
          - supplier / third-party risk is reviewed;
          - outbound data and privacy impact are documented;
          - external actions are pinned to immutable full commit SHAs;
          - permissions are least-privilege and separated from the scanner where feasible;
          - report destination and retention are approved;
          - secrets and personal data exposure paths are reviewed;
          - a rollback / disable path exists.

          REFERENCE != IMPLEMENTED != EVIDENCED != VERIFIED != CERTIFIED
          TOKEN_VAZIO is not PASS.
          claim_allowed=false
          EOF
