name: Program Finalization Cohesion V1

on:
  pull_request:
    paths:
      - 'indices/ATLAS_X_PROGRAM_FINALIZATION_CURRENT_V1.json'
      - 'scripts/validate_program_finalization_cohesion_v1.py'
      - '.github/workflows/program-finalization-cohesion-v1.yml'
      - 'docs/canonical/2026-09-08/RAFAELIA_PROGRAM_FINALIZATION_COHESION_DELTA_V1.md'
      - 'receipts/program-finalization/2026-09-08/RAFAELIA_PROGRAM_FINALIZATION_COHESION_RECEIPT.v1.json'
      - 'receipts/program-finalization/2026-09-08/RAFAELIA_PROGRAM_FINALIZATION_CI_READBACK_RECEIPT.v1.json'
  push:
    branches: [main]
    paths:
      - 'indices/ATLAS_X_PROGRAM_FINALIZATION_CURRENT_V1.json'
      - 'scripts/validate_program_finalization_cohesion_v1.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pinned Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate fail-closed program cohesion
        run: python scripts/validate_program_finalization_cohesion_v1.py
