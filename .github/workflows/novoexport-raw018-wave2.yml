name: novoexport-raw018-wave2

on:
  pull_request:
    paths:
      - 'data/evidence/novoexport_raw018_wave2_20260824.v1.json'
      - 'tools/validate_novoexport_raw018_wave2.py'
      - '.github/workflows/novoexport-raw018-wave2.yml'
      - 'indices/NOVOEXPORT_RAW018_WAVE2_20260824_V1.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pinned commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile validator
        run: python3 -m py_compile tools/validate_novoexport_raw018_wave2.py
      - name: Validate raw018 evidence transition
        run: python3 tools/validate_novoexport_raw018_wave2.py
