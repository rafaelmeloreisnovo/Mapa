name: RAFAELIA Custody Profiles Gate

on:
  pull_request:
    paths:
      - "docs/governance/CUSTODY_PROFILES_CROSS_PROVIDER_V1.md"
      - "schemas/custody_profiles_registry.v1.schema.json"
      - "data/governance/custody_profiles.v1.json"
      - "tools/validate_custody_profiles.py"
      - "tests/test_custody_profiles.py"
      - ".github/workflows/custody-profiles-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custody-profiles-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate-custody-profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Compile validator and tests
        run: |
          python -m py_compile tools/validate_custody_profiles.py
          python -m py_compile tests/test_custody_profiles.py
      - name: Parse registry and schema
        run: |
          python -m json.tool data/governance/custody_profiles.v1.json >/dev/null
          python -m json.tool schemas/custody_profiles_registry.v1.schema.json >/dev/null
      - name: Run custody regression suite
        run: python tests/test_custody_profiles.py
      - name: Validate canonical custody registry
        run: python tools/validate_custody_profiles.py data/governance/custody_profiles.v1.json
