name: Open Work Execution Contract

on:
  pull_request:
    paths:
      - "data/gaps/open_work_execution_contract.20260808.v1.json"
      - "data/gaps/open_work_execution_contract.delta.20260808.v2.json"
      - "tools/validate_open_work_execution_contract.py"
      - "tools/validate_open_work_execution_contract_v2_delta.py"
      - "tests/test_open_work_execution_contract.py"
      - "tests/test_open_work_execution_contract_v2_delta.py"
      - ".github/workflows/open-work-execution-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@692973e3563ff3c01220e3a44793f4a10eb60ae8
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@1f56a43ccd0f2b32b6c62cc8f2fb4ad78ce05d45
        with:
          python-version: "3.12"
      - name: Validate V1 release-authority contract fail-closed
        run: python tools/validate_open_work_execution_contract.py
      - name: Run V1 contract tests
        run: python -m unittest -v tests.test_open_work_execution_contract
      - name: Validate append-only V2 lab delta fail-closed
        run: python tools/validate_open_work_execution_contract_v2_delta.py
      - name: Run V2 delta tests
        run: python -m unittest -v tests.test_open_work_execution_contract_v2_delta
