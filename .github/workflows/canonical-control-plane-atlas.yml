name: Canonical Control Plane Atlas

"on":
  push:
    paths:
      - 'data/control-plane/CANONICAL_CONTROL_PLANE_ATLAS_V1_20260829.json'
      - 'data/receipts/CANONICAL_CONTROL_PLANE_BOOTSTRAP_20260829.v1.json'
      - 'schemas/canonical_control_plane_atlas.v1.schema.json'
      - 'scripts/validate_canonical_control_plane_atlas.py'
      - 'fixtures/canonical_control_plane_atlas.invalid.token_zero.v1.json'
      - 'tests/test_canonical_control_plane_atlas.py'
      - '.github/workflows/canonical-control-plane-atlas.yml'
  pull_request:
    paths:
      - 'data/control-plane/CANONICAL_CONTROL_PLANE_ATLAS_V1_20260829.json'
      - 'data/receipts/CANONICAL_CONTROL_PLANE_BOOTSTRAP_20260829.v1.json'
      - 'schemas/canonical_control_plane_atlas.v1.schema.json'
      - 'scripts/validate_canonical_control_plane_atlas.py'
      - 'fixtures/canonical_control_plane_atlas.invalid.token_zero.v1.json'
      - 'tests/test_canonical_control_plane_atlas.py'
      - '.github/workflows/canonical-control-plane-atlas.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate canonical control-plane
        run: python3 scripts/validate_canonical_control_plane_atlas.py
      - name: Run anti-regression tests
        run: python3 tests/test_canonical_control_plane_atlas.py
