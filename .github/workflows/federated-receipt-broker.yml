name: Federated Receipt Broker

on:
  workflow_dispatch:
    inputs:
      receipt_url:
        description: "Repository-local receipt path; remote URL transport remains TOKEN_VAZIO"
        required: false
        type: string
      producer_id:
        description: "Producer repo identifier (owner/repo)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  receive-and-validate:
    name: Receive & Validate Federated Receipt
    runs-on: ubuntu-latest
    outputs:
      receipt_id: ${{ steps.receive.outputs.receipt_id }}
      validation_status: ${{ steps.validate.outputs.status }}
      provenance_status: ${{ steps.provenance.outputs.status }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@751276eafca55f10f252026015f43c488f2322ba
        with:
          python-version: "3.12"

      - name: "GATE 1: Receive and classify receipt"
        id: receive
        env:
          RECEIPT_PATH: ${{ inputs.receipt_url || 'tests/fixtures/federated/self-test-receipt.json' }}
          PRODUCER_ID: ${{ inputs.producer_id || 'self-test' }}
        run: |
          set -euo pipefail
          receipt_id="receipt-$(date +%s%N)"
          echo "receipt_id=$receipt_id" >> "$GITHUB_OUTPUT"
          test -f "$RECEIPT_PATH" || {
            echo "::error::Remote receipt transport/download is not implemented; receipt must be a repository-local path"
            exit 2
          }
          mkdir -p build/federated-broker
          printf '{"receipt_id":"%s","producer":"%s","receipt_path":"%s","claim_allowed":false}\n' \
            "$receipt_id" "$PRODUCER_ID" "$RECEIPT_PATH" \
            > build/federated-broker/arrival.json

      - name: "GATE 2: Schema, policy and bounded receipt validation"
        id: validate
        env:
          RECEIPT_PATH: ${{ inputs.receipt_url || 'tests/fixtures/federated/self-test-receipt.json' }}
        run: |
          set -euo pipefail
          python3 tools/validate_federated_receipt.py \
            --receipt "$RECEIPT_PATH" \
            --policy data/control-plane/federation-policy.v1.json \
            --verbose > build/federated-broker/validation.json
          cat build/federated-broker/validation.json
          status=$(python3 -c "import json; print(json.load(open('build/federated-broker/validation.json')).get('status','UNKNOWN'))")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          test "$status" = "VALIDATED"

      - name: "GATE 3: Signature boundary"
        env:
          PRODUCER_ID: ${{ inputs.producer_id || 'self-test' }}
        run: |
          set -euo pipefail
          if [ "$PRODUCER_ID" != "self-test" ]; then
            echo "::error::TOKEN_VAZIO_HMAC: production HMAC secret verification is not implemented in validate_federated_receipt.py"
            exit 3
          fi
          echo "SELF_TEST_LIMITED: signature fields are structurally checked; cryptographic HMAC verification is not claimed"

      - name: "GATE 4: Cross-repository provenance verification"
        id: provenance
        env:
          RECEIPT_PATH: ${{ inputs.receipt_url || 'tests/fixtures/federated/self-test-receipt.json' }}
        run: |
          set -euo pipefail
          test -f tools/verify_cross_repo_provenance.py || {
            echo "::error::TOKEN_VAZIO_PROVENANCE_VERIFIER"
            exit 4
          }
          python3 tools/verify_cross_repo_provenance.py \
            --receipt "$RECEIPT_PATH" \
            --policy data/control-plane/federation-policy.v1.json \
            > build/federated-broker/provenance.json
          cat build/federated-broker/provenance.json
          status=$(python3 -c "import json; print(json.load(open('build/federated-broker/provenance.json')).get('status','UNKNOWN'))")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          case "$status" in PASS|VERIFIED_LIMITED) ;; *) exit 4 ;; esac

      - name: "GATE 5: Immutability markers"
        env:
          RECEIPT_PATH: ${{ inputs.receipt_url || 'tests/fixtures/federated/self-test-receipt.json' }}
        run: |
          set -euo pipefail
          python3 - "$RECEIPT_PATH" <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1], encoding='utf-8'))
          blocks=[r.get('producer_commitment',{}),r.get('provenance_chain',{}),r.get('federation_metadata',{})]
          required=['source_run_id','source_job_id','signature_timestamp','received_at_utc']
          missing=[k for k in required if not any(k in b for b in blocks)]
          if missing:
              raise SystemExit('missing immutability markers: '+','.join(missing))
          print('PASS immutability markers:', ','.join(required))
          PY

      - name: "LANE 04/06 bounded decision receipt"
        if: success()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          out={
            'observed_at': datetime.now(timezone.utc).isoformat(),
            'state':'VERIFIED_LIMITED_SELF_TEST',
            'lane_04_validation':'PASS_BOUNDED',
            'lane_06_integration':'TOKEN_VAZIO_EXTERNAL_FEDERATION',
            'claim_allowed':False,
            'limitations':[
              'external HMAC verification not implemented',
              'remote receipt transport not implemented',
              'cross-repo checkout verification limited to locally inspectable producer paths'
            ]
          }
          open('build/federated-broker/decision.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          cat build/federated-broker/decision.json

      - name: Store broker evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: federated-receipt-broker-${{ steps.receive.outputs.receipt_id }}
          path: build/federated-broker/
          retention-days: 90

  lane-00-review:
    name: "Lane 00: Governance Review Boundary"
    needs: receive-and-validate
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Preserve human approval boundary
        run: |
          echo "REVIEW_REQUIRED"
          echo "No receipt is promoted automatically."
          echo "claim_allowed=false"
