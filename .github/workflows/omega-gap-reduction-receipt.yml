name: Omega Gap Reduction Receipt

on:
  push:
    paths:
      - 'data/reconciliation/OMEGA_GAP_REDUCTION_RECEIPT_20260829.v1.json'
      - 'data/reconciliation/OMEGA_GAP_REDUCTION_CI_RECEIPT_20260829.v1.json'
      - 'data/reconciliation/GENESIS_SEAL_ROOT_CUSTODY_EXCEPTION_20260829.v1.json'
      - 'data/reconciliation/OMEGA_GAP_REDUCTION_TERMINAL_RECEIPT_20260829.v1.json'
      - 'data/reconciliation/OMEGA_OPERATIONAL_WORK_LEDGER_20260829.v2.json'
      - 'scripts/validate_omega_gap_reduction_receipt.py'
      - '.github/workflows/omega-gap-reduction-receipt.yml'
  pull_request:
    paths:
      - 'data/reconciliation/OMEGA_GAP_REDUCTION_RECEIPT_20260829.v1.json'
      - 'data/reconciliation/OMEGA_GAP_REDUCTION_CI_RECEIPT_20260829.v1.json'
      - 'data/reconciliation/GENESIS_SEAL_ROOT_CUSTODY_EXCEPTION_20260829.v1.json'
      - 'data/reconciliation/OMEGA_GAP_REDUCTION_TERMINAL_RECEIPT_20260829.v1.json'
      - 'data/reconciliation/OMEGA_OPERATIONAL_WORK_LEDGER_20260829.v2.json'
      - 'scripts/validate_omega_gap_reduction_receipt.py'
      - '.github/workflows/omega-gap-reduction-receipt.yml'

permissions:
  contents: read

jobs:
  validate-gap-reduction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate terminal gaps, provenance, CI causality, Genesis Seal custody and anti-regression
        run: python3 scripts/validate_omega_gap_reduction_receipt.py
