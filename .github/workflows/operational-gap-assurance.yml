name: operational-gap-assurance

on:
  pull_request:
    paths:
      - "scripts/operational_gap_assurance.py"
      - "scripts/operational_gap_record_gate.py"
      - "scripts/component_lifecycle_assurance.py"
      - "scripts/token_vazio_master_gate.py"
      - "tools/verify_cross_repo_provenance.py"
      - "data/routing/operational-gaps/**"
      - "data/routing/component-lifecycle/**"
      - "data/control-plane/TOKEN_VAZIO_MASTER_CURRENT_BOUNDED_*.json"
      - ".github/workflows/operational-gap-assurance.yml"
      - ".github/workflows/federated-receipt-broker.yml"
  push:
    branches: [main]
    paths:
      - "scripts/operational_gap_assurance.py"
      - "scripts/operational_gap_record_gate.py"
      - "scripts/component_lifecycle_assurance.py"
      - "scripts/token_vazio_master_gate.py"
      - "tools/verify_cross_repo_provenance.py"
      - "data/routing/operational-gaps/**"
      - "data/routing/component-lifecycle/**"
      - "data/control-plane/TOKEN_VAZIO_MASTER_CURRENT_BOUNDED_*.json"
      - ".github/workflows/operational-gap-assurance.yml"
      - ".github/workflows/federated-receipt-broker.yml"

permissions:
  contents: read

jobs:
  deterministic-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile assurance engines
        run: |
          python3 -m py_compile \
            scripts/operational_gap_assurance.py \
            scripts/operational_gap_record_gate.py \
            scripts/component_lifecycle_assurance.py \
            scripts/token_vazio_master_gate.py \
            tools/verify_cross_repo_provenance.py
      - name: Operational gap self-test
        run: python3 scripts/operational_gap_assurance.py --self-test
      - name: Validate operational gap records
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r record; do
            count=$((count + 1))
            python3 scripts/operational_gap_record_gate.py "$record"
          done < <(find data/routing/operational-gaps -type f -name '*.json' -print | sort)
          test "$count" -gt 0
      - name: Validate bounded TOKEN_VAZIO master snapshots
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r record; do
            count=$((count + 1))
            python3 scripts/token_vazio_master_gate.py "$record"
          done < <(find data/control-plane -maxdepth 1 -type f -name 'TOKEN_VAZIO_MASTER_CURRENT_BOUNDED_*.json' -print | sort)
          test "$count" -gt 0
      - name: Validate component lifecycle ledgers
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r record; do
            count=$((count + 1))
            python3 scripts/component_lifecycle_assurance.py "$record"
          done < <(find data/routing/component-lifecycle -type f -name '*.json' -print | sort)
          test "$count" -gt 0
      - name: Verify self-test cross-repo provenance
        run: |
          python3 tools/verify_cross_repo_provenance.py \
            --receipt tests/fixtures/federated/self-test-receipt.json \
            --policy data/control-plane/federation-policy.v1.json
