name: F_GAP Ledger Gate

on:
  pull_request:
    paths:
      - 'data/governance/f_gap_ledger.v1.json'
      - 'schema/f_gap_ledger.v1.schema.json'
      - 'scripts/validate_f_gap_ledger.py'
      - 'docs/governance/F_GAP_LEDGER_20260810.md'
  push:
    paths:
      - 'data/governance/f_gap_ledger.v1.json'
      - 'schema/f_gap_ledger.v1.schema.json'
      - 'scripts/validate_f_gap_ledger.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@b4ffde65f46336ab88eb53b2ddc3a3808b9a7055
      - uses: actions/setup-python@f677139bbe7f9c59030f3aa62b693246ab674ec9
        with:
          python-version: '3.12'
      - name: Validate F_GAP ledger
        run: python scripts/validate_f_gap_ledger.py data/governance/f_gap_ledger.v1.json
