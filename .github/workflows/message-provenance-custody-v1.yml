name: Message Provenance Custody V1
on:
  pull_request:
    paths:
      - 'indices/ATLAS_X_MESSAGE_PROVENANCE_CURRENT_V1.json'
      - 'indices/deltas/ATLAS_X_MESSAGE_PROVENANCE_CUSTODY_20260907.md'
      - 'receipts/2026-09-07_ATLAS_MESSAGE_PROVENANCE_CUSTODY_V1.json'
      - 'scripts/validate_message_provenance_custody_v1.py'
      - '.github/workflows/message-provenance-custody-v1.yml'
permissions:
  contents: read
jobs:
  provenance-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate append-only message provenance state
        run: python3 scripts/validate_message_provenance_custody_v1.py
