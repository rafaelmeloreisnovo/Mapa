name: RAFAELIA Gap Atlas V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "data/gap-atlas/**"
      - "schemas/rafaelia_gap_atlas.v1.schema.json"
      - "tools/validate_rafaelia_gap_atlas.py"
      - "tools/rafaelia_gap_discovery_adapter.py"
      - "tools/rafaelia_specialized_ledger_adapter.py"
      - "tools/materialize_effective_gap_atlas.py"
      - "tools/repository_gap_mapper.py"
      - "tools/systematic_pragmatic_mapping_service.py"
      - "tools/materialize_systematic_pragmatic_children.py"
      - "tools/probe_systematic_pragmatic_routing.py"
      - "tools/materialize_systematic_pragmatic_routing_bindings.py"
      - "tools/reconcile_systematic_pragmatic_source_gaps.py"
      - "tools/materialize_systematic_pragmatic_g4_proposals.py"
      - "tools/materialize_systematic_pragmatic_canonical_completion.py"
      - "tools/enrich_systematic_pragmatic_identity_semantics.py"
      - "tests/test_systematic_pragmatic_mapping_service.py"
      - "tests/test_materialize_systematic_pragmatic_children.py"
      - "tests/test_probe_systematic_pragmatic_routing.py"
      - "tests/test_materialize_systematic_pragmatic_routing_bindings.py"
      - "tests/test_reconcile_systematic_pragmatic_source_gaps.py"
      - "tests/test_materialize_systematic_pragmatic_g4_proposals.py"
      - "tests/test_materialize_systematic_pragmatic_canonical_completion.py"
      - "tests/test_enrich_systematic_pragmatic_identity_semantics.py"
      - "tests/test_systematic_pragmatic_g3_decisions.py"
      - "scripts/validate_systematic_pragmatic_g3_decisions.py"
      - "data/triage/systematic-pragmatic-g3-decisions.v1.jsonl"
      - "data/triage/systematic-pragmatic-authority-resolutions.v1.jsonl"
      - "tests/test_rafaelia_gap_atlas.py"
      - "tests/test_rafaelia_specialized_ledger_adapter.py"
      - "tests/test_materialize_effective_gap_atlas.py"
      - "indices/repository_authority_registry.json"
      - "scripts/validate_federated_registry.py"
      - "docs/canonical/RAFAELIA_GAP_ATLAS_V1.md"
      - "docs/canonical/RAFAELIA_SYSTEMATIC_PRAGMATIC_MAPPING_SERVICE_V1.md"
      - ".github/workflows/rafaelia-gap-atlas.yml"
  push:
    branches: [main]
    paths:
      - "data/gap-atlas/**"
      - "schemas/rafaelia_gap_atlas.v1.schema.json"
      - "tools/validate_rafaelia_gap_atlas.py"
      - "tools/rafaelia_gap_discovery_adapter.py"
      - "tools/rafaelia_specialized_ledger_adapter.py"
      - "tools/materialize_effective_gap_atlas.py"
      - "tools/repository_gap_mapper.py"
      - "tools/systematic_pragmatic_mapping_service.py"
      - "tools/materialize_systematic_pragmatic_children.py"
      - "tools/probe_systematic_pragmatic_routing.py"
      - "tools/materialize_systematic_pragmatic_routing_bindings.py"
      - "tools/reconcile_systematic_pragmatic_source_gaps.py"
      - "tools/materialize_systematic_pragmatic_g4_proposals.py"
      - "tools/materialize_systematic_pragmatic_canonical_completion.py"
      - "tools/enrich_systematic_pragmatic_identity_semantics.py"
      - "tests/test_systematic_pragmatic_mapping_service.py"
      - "tests/test_materialize_systematic_pragmatic_children.py"
      - "tests/test_probe_systematic_pragmatic_routing.py"
      - "tests/test_materialize_systematic_pragmatic_routing_bindings.py"
      - "tests/test_reconcile_systematic_pragmatic_source_gaps.py"
      - "tests/test_materialize_systematic_pragmatic_g4_proposals.py"
      - "tests/test_materialize_systematic_pragmatic_canonical_completion.py"
      - "tests/test_enrich_systematic_pragmatic_identity_semantics.py"
      - "tests/test_rafaelia_gap_atlas.py"
      - "tests/test_rafaelia_specialized_ledger_adapter.py"
      - "tests/test_materialize_effective_gap_atlas.py"
      - "indices/repository_authority_registry.json"
      - "scripts/validate_federated_registry.py"
      - "docs/canonical/RAFAELIA_GAP_ATLAS_V1.md"
      - "docs/canonical/RAFAELIA_SYSTEMATIC_PRAGMATIC_MAPPING_SERVICE_V1.md"
      - "data/triage/systematic-pragmatic-g3-decisions.v1.jsonl"
      - "data/triage/systematic-pragmatic-authority-resolutions.v1.jsonl"
      - ".github/workflows/rafaelia-gap-atlas.yml"

permissions:
  contents: read

concurrency:
  group: rafaelia-gap-atlas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Compile validators, adapters and tests
        run: |
          python3 -m py_compile tools/validate_rafaelia_gap_atlas.py
          python3 -m py_compile tools/rafaelia_gap_discovery_adapter.py
          python3 -m py_compile tools/rafaelia_specialized_ledger_adapter.py
          python3 -m py_compile tools/materialize_effective_gap_atlas.py
          python3 -m py_compile tools/repository_gap_mapper.py
          python3 -m py_compile tools/systematic_pragmatic_mapping_service.py
          python3 -m py_compile tools/materialize_systematic_pragmatic_children.py
          python3 -m py_compile tools/probe_systematic_pragmatic_routing.py
          python3 -m py_compile tools/materialize_systematic_pragmatic_routing_bindings.py
          python3 -m py_compile tools/reconcile_systematic_pragmatic_source_gaps.py
          python3 -m py_compile tools/materialize_systematic_pragmatic_g4_proposals.py
          python3 -m py_compile tools/materialize_systematic_pragmatic_canonical_completion.py
          python3 -m py_compile tools/enrich_systematic_pragmatic_identity_semantics.py
          python3 -m py_compile tests/test_systematic_pragmatic_mapping_service.py
          python3 -m py_compile tests/test_materialize_systematic_pragmatic_children.py
          python3 -m py_compile tests/test_probe_systematic_pragmatic_routing.py
          python3 -m py_compile tests/test_materialize_systematic_pragmatic_routing_bindings.py
          python3 -m py_compile tests/test_reconcile_systematic_pragmatic_source_gaps.py
          python3 -m py_compile tests/test_materialize_systematic_pragmatic_g4_proposals.py
          python3 -m py_compile tests/test_materialize_systematic_pragmatic_canonical_completion.py
          python3 -m py_compile tests/test_enrich_systematic_pragmatic_identity_semantics.py
          python3 -m py_compile tests/test_systematic_pragmatic_g3_decisions.py
          python3 -m py_compile scripts/validate_systematic_pragmatic_g3_decisions.py
          python3 -m py_compile tests/test_rafaelia_gap_atlas.py
          python3 -m py_compile tests/test_rafaelia_specialized_ledger_adapter.py
          python3 -m py_compile tests/test_materialize_effective_gap_atlas.py
          python3 -m py_compile scripts/validate_federated_registry.py

      - name: Validate JSON syntax
        run: |
          python3 -m json.tool data/gap-atlas/RAFAELIA_GAP_ATLAS_V1.json >/dev/null
          python3 -m json.tool data/gap-atlas/PROVIDER_COVERAGE_V1.json >/dev/null
          python3 -m json.tool data/gap-atlas/SOURCE_ADAPTER_REGISTRY_V1.json >/dev/null
          python3 -m json.tool data/gap-atlas/GAP_STATE_OVERRIDES_V1.json >/dev/null
          python3 -m json.tool schemas/rafaelia_gap_atlas.v1.schema.json >/dev/null
          python3 -m json.tool indices/repository_authority_registry.json >/dev/null
          while IFS= read -r line; do
            [ -z "$line" ] || printf '%s\n' "$line" | python3 -m json.tool >/dev/null
          done < data/gap-atlas/RAFAELIA_GAP_EVENTS_V1.jsonl
          while IFS= read -r line; do
            [ -z "$line" ] || printf '%s\n' "$line" | python3 -m json.tool >/dev/null
          done < data/gap-atlas/RAFAELIA_GAP_RECORD_APPEND_V1.jsonl
          while IFS= read -r line; do
            [ -z "$line" ] || printf '%s\n' "$line" | python3 -m json.tool >/dev/null
          done < data/triage/systematic-pragmatic-g3-decisions.v1.jsonl
          while IFS= read -r line; do
            [ -z "$line" ] || printf '%s\n' "$line" | python3 -m json.tool >/dev/null
          done < data/triage/systematic-pragmatic-authority-resolutions.v1.jsonl

      - name: Validate federated authority registry
        run: python3 scripts/validate_federated_registry.py | tee federated-authority-validation.json

      - name: Validate immutable Gap Atlas seed
        run: |
          python3 tools/validate_rafaelia_gap_atlas.py \
            --write-report artifacts/gap-atlas/validation_report.json \
            | tee gap-atlas-validation.json

      - name: Materialize effective append-only atlas
        run: |
          mkdir -p artifacts/gap-atlas
          python3 tools/materialize_effective_gap_atlas.py \
            --output artifacts/gap-atlas/effective_gap_atlas.json \
            | tee effective-gap-atlas-counts.json

      - name: Run fail-closed regression tests
        run: |
          python3 -m unittest -v tests/test_rafaelia_gap_atlas.py
          python3 -m unittest -v tests/test_rafaelia_specialized_ledger_adapter.py
          python3 -m unittest -v tests/test_materialize_effective_gap_atlas.py
          python3 -m unittest -v tests/test_systematic_pragmatic_mapping_service.py
          python3 -m unittest -v tests/test_materialize_systematic_pragmatic_children.py
          python3 -m unittest -v tests/test_probe_systematic_pragmatic_routing.py
          python3 -m unittest -v tests/test_materialize_systematic_pragmatic_routing_bindings.py
          python3 -m unittest -v tests/test_reconcile_systematic_pragmatic_source_gaps.py
          python3 -m unittest -v tests/test_materialize_systematic_pragmatic_g4_proposals.py
          python3 -m unittest -v tests/test_materialize_systematic_pragmatic_canonical_completion.py
          python3 -m unittest -v tests/test_enrich_systematic_pragmatic_identity_semantics.py
          python3 -m unittest -v tests/test_systematic_pragmatic_g3_decisions.py

      - name: Validate evidence-backed G3 decisions
        run: |
          mkdir -p artifacts/systematic-pragmatic-map
          python3 scripts/validate_systematic_pragmatic_g3_decisions.py \
            data/triage/systematic-pragmatic-g3-decisions.v1.jsonl \
            --write-report artifacts/systematic-pragmatic-map/g3_decision_validation.json
          test "$(python3 -c 'import json; print(json.load(open("artifacts/systematic-pragmatic-map/g3_decision_validation.json"))["status"])')" = "PASS"

      - name: Generate bounded repository gap map
        run: |
          python3 tools/repository_gap_mapper.py \
            --root Mapa=. \
            --exclude generated \
            --exclude artifacts \
            --output-json artifacts/gap-atlas/repository_gap_map.json \
            --output-md artifacts/gap-atlas/repository_gap_map.md \
            --fail-on none

      - name: Convert unmapped observations into discovery candidates
        run: |
          python3 tools/rafaelia_gap_discovery_adapter.py \
            --gap-map artifacts/gap-atlas/repository_gap_map.json \
            --atlas data/gap-atlas/RAFAELIA_GAP_ATLAS_V1.json \
            --output artifacts/gap-atlas/discovery_candidates.json \
            | tee gap-discovery-summary.json

      - name: Generate systematic pragmatic action map
        run: |
          python3 tools/systematic_pragmatic_mapping_service.py \
            --root Mapa=. \
            --exclude generated \
            --exclude artifacts \
            --output-dir artifacts/systematic-pragmatic-map \
            --fail-on none \
            | tee systematic-pragmatic-summary.json

      - name: Materialize recursive G3 child clusters
        run: |
          python3 tools/materialize_systematic_pragmatic_children.py \
            --action-map artifacts/systematic-pragmatic-map/pragmatic_action_map.json \
            --decisions data/triage/systematic-pragmatic-g3-decisions.v1.jsonl \
            --output artifacts/systematic-pragmatic-map/child_clusters.json \
            | tee systematic-pragmatic-children-summary.json

      - name: Probe routing descendant semantics
        run: |
          python3 tools/probe_systematic_pragmatic_routing.py \
            --action-map artifacts/systematic-pragmatic-map/pragmatic_action_map.json \
            --repo-root . \
            --output artifacts/systematic-pragmatic-map/routing_semantic_probe.json \
            | tee systematic-pragmatic-routing-summary.json

      - name: Materialize routing semantic families and gap bindings
        run: |
          python3 tools/materialize_systematic_pragmatic_routing_bindings.py \
            --action-map artifacts/systematic-pragmatic-map/pragmatic_action_map.json \
            --decisions data/triage/systematic-pragmatic-g3-decisions.v1.jsonl \
            --repo-root . \
            --output artifacts/systematic-pragmatic-map/routing_bindings.json \
            | tee systematic-pragmatic-routing-bindings-summary.json

      - name: Reconcile source gap identities to effective Atlas
        run: |
          python3 tools/reconcile_systematic_pragmatic_source_gaps.py \
            --routing-bindings artifacts/systematic-pragmatic-map/routing_bindings.json \
            --effective-atlas artifacts/gap-atlas/effective_gap_atlas.json \
            --output artifacts/systematic-pragmatic-map/source_gap_reconciliation.json \
            | tee systematic-pragmatic-g4-reconciliation-summary.json

      - name: Materialize governed G4 append-link proposals
        run: |
          python3 tools/materialize_systematic_pragmatic_g4_proposals.py \
            --reconciliation artifacts/systematic-pragmatic-map/source_gap_reconciliation.json \
            --repo-root . \
            --authority-resolutions data/triage/systematic-pragmatic-authority-resolutions.v1.jsonl \
            --output artifacts/systematic-pragmatic-map/g4_proposals.json \
            | tee systematic-pragmatic-g4-proposals-summary.json

      - name: Materialize evidence-typed canonical completion
        run: |
          python3 tools/materialize_systematic_pragmatic_canonical_completion.py \
            --proposals artifacts/systematic-pragmatic-map/g4_proposals.json \
            --repo-root . \
            --output artifacts/systematic-pragmatic-map/canonical_completion.json \
            | tee systematic-pragmatic-canonical-completion-summary.json

      - name: Enrich identity and semantics from structured source evidence
        run: |
          python3 tools/enrich_systematic_pragmatic_identity_semantics.py \
            --completion artifacts/systematic-pragmatic-map/canonical_completion.json \
            --repo-root . \
            --output artifacts/systematic-pragmatic-map/identity_semantics_enrichment.json \
            | tee systematic-pragmatic-identity-semantics-summary.json

      - name: Guard coverage, effective state and claim boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          atlas = json.loads(Path('data/gap-atlas/RAFAELIA_GAP_ATLAS_V1.json').read_text())
          report = json.loads(Path('artifacts/gap-atlas/validation_report.json').read_text())
          effective = json.loads(Path('artifacts/gap-atlas/effective_gap_atlas.json').read_text())
          discovery = json.loads(Path('artifacts/gap-atlas/discovery_candidates.json').read_text())
          pragmatic = json.loads(Path('artifacts/systematic-pragmatic-map/pragmatic_action_map.json').read_text())
          pragmatic_review = json.loads(Path('artifacts/systematic-pragmatic-map/cluster_review_queue.json').read_text())
          pragmatic_receipt = json.loads(Path('artifacts/systematic-pragmatic-map/receipt.json').read_text())
          pragmatic_children = json.loads(Path('artifacts/systematic-pragmatic-map/child_clusters.json').read_text())
          routing_probe = json.loads(Path('artifacts/systematic-pragmatic-map/routing_semantic_probe.json').read_text())
          routing_bindings = json.loads(Path('artifacts/systematic-pragmatic-map/routing_bindings.json').read_text())
          source_gap_reconciliation = json.loads(Path('artifacts/systematic-pragmatic-map/source_gap_reconciliation.json').read_text())
          g4_proposals = json.loads(Path('artifacts/systematic-pragmatic-map/g4_proposals.json').read_text())
          canonical_completion = json.loads(Path('artifacts/systematic-pragmatic-map/canonical_completion.json').read_text())
          identity_semantics = json.loads(Path('artifacts/systematic-pragmatic-map/identity_semantics_enrichment.json').read_text())
          coverage = json.loads(Path('data/gap-atlas/PROVIDER_COVERAGE_V1.json').read_text())
          adapters = json.loads(Path('data/gap-atlas/SOURCE_ADAPTER_REGISTRY_V1.json').read_text())
          overrides = json.loads(Path('data/gap-atlas/GAP_STATE_OVERRIDES_V1.json').read_text())
          assert atlas['claim_allowed'] is False
          assert report['claim_allowed'] is False
          assert report['publication_ready'] is False
          assert report['p0_open'] > 0
          assert effective['claim_allowed'] is False
          assert effective['publication_ready'] is False
          assert effective['counts']['seed_records'] == 26
          assert effective['counts']['appended_records'] == 5
          assert effective['counts']['effective_records'] == 31
          by_id = {r['gap_id']: r for r in effective['records']}
          assert by_id['GAP-META-INVENTORY-001']['effective_state'] == 'REDUCED'
          assert by_id['GAP-CONVERSATIONS-018-027-CUSTODY-001']['effective_state'] == 'REDUCED'
          assert by_id['GAP-CONVERSATIONS-TOKENIZER-001']['effective_state'] == 'TOKEN_VAZIO'
          assert by_id['GAP-CONVERSATIONS-ASSET-JOIN-001']['effective_state'] == 'TOKEN_VAZIO'
          assert by_id['GAP-DRIVE-GITHUB-PROVENANCE-001']['effective_state'] == 'TOKEN_VAZIO'
          assert by_id['GAP-TRAINING-EVIDENCE-001']['effective_state'] == 'NOT_MEASURED'
          assert discovery['claim_allowed'] is False
          assert pragmatic['claim_allowed'] is False
          assert pragmatic_receipt['claim_allowed'] is False
          assert pragmatic_review['claim_allowed'] is False
          assert pragmatic['flow'] == ['SCAN', 'BIND', 'NIBIGUIRI', 'PRIORIZE', 'SERVICE', 'GATE', 'RECEIPT']
          assert pragmatic['summary']['clusters'] == len(pragmatic['clusters'])
          assert pragmatic['summary']['largest_cluster_actions'] >= 0
          assert all(
              row['nibiguiri_state'] != 'NIBIGUIRI:OBVIO_NAO_INDEXADO'
              for row in pragmatic['actions']
              if not row['mapped_gap_ids']
          )
          assert all(cluster['claim_allowed'] is False for cluster in pragmatic['clusters'])
          assert all(
              cluster['g3_semantic_split_gate']['state'] == 'REVIEW_REQUIRED'
              and cluster['g4_authority_bind_gate']['state'] == 'BLOCKED_BY_G3'
              and cluster['g4_authority_bind_gate']['auto_create_gap_id'] is False
              for cluster in pragmatic_review['clusters']
          )
          assert pragmatic_review['policy']['cluster_is_not_equivalence'] is True
          assert pragmatic_review['policy']['authority_binding_requires_g3_evidence'] is True
          assert pragmatic_receipt['g3_state'] in {'REVIEW_REQUIRED', 'NOT_APPLICABLE'}
          assert pragmatic_receipt['g4_state'] in {'BLOCKED_BY_G3', 'NOT_APPLICABLE'}
          assert pragmatic_receipt['cluster_digest_sha256']
          assert pragmatic_receipt['cluster_review_digest_sha256']
          assert pragmatic_children['claim_allowed'] is False
          assert pragmatic_children['policy']['child_is_not_equivalence'] is True
          assert pragmatic_children['policy']['auto_create_gap_id'] is False
          assert pragmatic_children['summary']['level1_children'] > 0
          assert pragmatic_children['summary']['max_level'] >= 2
          by_scope = {row['scope_prefix']: row for row in pragmatic_children['children']}
          assert by_scope['data/routing']['g3']['state'] == 'SPLIT_REQUIRED'
          assert by_scope['data/routing']['g4']['state'] == 'BLOCKED_BY_G3_SPLIT'
          assert by_scope['data/routing']['g4']['binding'] == 'TOKEN_VAZIO'
          assert by_scope['data/routing']['g4']['auto_create_gap_id'] is False
          assert 'data/routing/cycles' in by_scope
          assert 'data/routing/operational-gaps' in by_scope
          assert all(row['claim_allowed'] is False for row in pragmatic_children['children'])
          assert routing_probe['claim_allowed'] is False
          assert routing_probe['cycles']['selected_actions'] > 0
          assert routing_probe['operational_gaps']['selected_actions'] > 0
          assert routing_probe['cycles']['parseable_json'] == routing_probe['cycles']['selected_actions']
          assert routing_probe['operational_gaps']['parseable_json'] == routing_probe['operational_gaps']['selected_actions']
          assert routing_probe['operational_gaps']['with_gap_id'] > 0
          assert routing_bindings['claim_allowed'] is False
          assert routing_bindings['policy']['schema_family_is_not_same_situation'] is True
          assert routing_bindings['policy']['source_gap_id_is_not_atlas_binding'] is True
          assert routing_bindings['summary']['schema_families'] == 25
          assert routing_bindings['summary']['source_gap_binding_candidates'] == 35
          assert routing_bindings['summary']['multi_record_gap_ids'] == 1
          assert all(row['g3']['state'] == 'REVIEW_REQUIRED' for row in routing_bindings['schema_families'])
          assert all(row['g4']['atlas_gap_id'] == 'TOKEN_VAZIO' for row in routing_bindings['gap_binding_candidates'])
          assert all(row['g4']['auto_create_gap_id'] is False for row in routing_bindings['gap_binding_candidates'])
          assert source_gap_reconciliation['claim_allowed'] is False
          assert source_gap_reconciliation['policy']['fuzzy_matching_forbidden'] is True
          assert source_gap_reconciliation['policy']['exact_evidence_is_candidate_not_binding'] is True
          assert source_gap_reconciliation['summary']['source_gap_candidates'] == 35
          assert sum(source_gap_reconciliation['summary']['by_status'].values()) == 35
          assert all(row['g4']['atlas_gap_id'] == 'TOKEN_VAZIO' for row in source_gap_reconciliation['reconciliation'])
          assert all(row['g4']['auto_create_gap_id'] is False for row in source_gap_reconciliation['reconciliation'])
          assert all(row['g4']['human_or_governed_confirmation_required'] is True for row in source_gap_reconciliation['reconciliation'])
          assert g4_proposals['claim_allowed'] is False
          assert g4_proposals['atlas_mutation_allowed'] is False
          assert g4_proposals['policy']['proposal_is_not_binding'] is True
          assert g4_proposals['policy']['proposal_is_not_append'] is True
          assert g4_proposals['summary']['proposals'] == 35
          assert g4_proposals['summary']['by_action'].get('PROPOSE_APPEND_NEW') == 35
          assert g4_proposals['summary']['by_action'].get('NEEDS_MORE_EVIDENCE', 0) == 0
          assert g4_proposals['summary']['authority_resolutions_applied'] == 1
          assert sum(g4_proposals['summary']['by_action'].values()) == 35
          assert all(row['proposed_atlas_gap_id'] == 'TOKEN_VAZIO' for row in g4_proposals['proposals'])
          assert all(row['g4']['atlas_mutation_allowed'] is False for row in g4_proposals['proposals'])
          assert all(row['g4']['auto_create_gap_id'] is False for row in g4_proposals['proposals'])
          assert canonical_completion['claim_allowed'] is False
          assert canonical_completion['atlas_mutation_allowed'] is False
          assert canonical_completion['policy']['canonical_completion_is_not_atlas_record'] is True
          assert canonical_completion['policy']['alias_is_not_equivalence'] is True
          assert canonical_completion['summary']['completion_candidates'] == 35
          assert canonical_completion['summary']['baseline_existing_proposals'] == 34
          assert canonical_completion['summary']['newly_unblocked_by_authority'] == 1
          assert all(row['proposed_atlas_gap_id'] == 'TOKEN_VAZIO' for row in canonical_completion['completions'])
          assert all(row['g4']['atlas_mutation_allowed'] is False for row in canonical_completion['completions'])
          assert all(row['g4']['auto_create_gap_id'] is False for row in canonical_completion['completions'])
          assert identity_semantics['claim_allowed'] is False
          assert identity_semantics['atlas_mutation_allowed'] is False
          assert identity_semantics['summary']['records'] == 35
          assert identity_semantics['policy']['same_key_structured_evidence_is_not_auto_promotion'] is True
          assert identity_semantics['policy']['provider_normalization_is_candidate_not_binding'] is True
          assert identity_semantics['policy']['artifact_identity_requires_explicit_source_evidence'] is True
          assert all(row['proposed_atlas_gap_id'] == 'TOKEN_VAZIO' for row in identity_semantics['enrichments'])
          assert all(row['g4']['atlas_mutation_allowed'] is False for row in identity_semantics['enrichments'])
          assert all(row['g4']['auto_create_gap_id'] is False for row in identity_semantics['enrichments'])
          assert coverage['claim_allowed'] is False
          assert coverage['github_authority_registry']['observed'] == coverage['github_authority_registry']['expected'] == 14
          assert coverage['drive_branch_registry']['observed_scopes'] == coverage['drive_branch_registry']['expected_scopes'] == 7
          assert coverage['drive_branch_registry']['level2_receipts_observed'] == 7
          assert adapters['claim_allowed'] is False
          assert adapters['global_boundary'] == 'ADAPTER_OUTPUT_IS_DISCOVERY_NOT_RESOLUTION'
          assert overrides['claim_allowed'] is False
          print('claim boundary preserved: seed+append+override materialization cannot promote open gaps')
          PY

