# Governance-sensitive issues must not be closed merely because time passed.
# This workflow is intentionally non-mutating. It preserves an explicit manual
# checkpoint until a future reviewed automation can prove safe label-based exclusions.
name: Governance stale review — non-closing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Preserve unresolved governance records
    runs-on: ubuntu-latest
    steps:
      - name: Record non-closing policy
        shell: bash
        run: |
          set -euo pipefail
          cat <<'EOF'
          Automatic stale closure is disabled.

          Inactivity is not evidence of resolution. Security, privacy, incident,
          audit, risk, legal, CAPA, evidence-missing, TOKEN_VAZIO, P0 and P1 records
          require an explicit closure criterion and evidence of that criterion.

          Future stale automation, if reintroduced, must be fail-safe and exclude
          governance-sensitive records from automatic closure.
          EOF
