name: Human Dignity Ethics Gate V1

"on":
  pull_request:
  push:
    branches: [main]

concurrency:
  group: human-dignity-ethics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ethics-ratchet:
    name: Human dignity no-regression gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate human dignity ethics ratchet
        run: python3 scripts/validate_human_dignity_ethics_ratchet.py
