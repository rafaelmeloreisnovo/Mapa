name: Semantic Tensor and Parable Gate

on:
  pull_request:
    paths:
      - "data/control-plane/rafaelia-semantic-tensor.v1.json"
      - "data/parables/traditional-parable-mechanisms.v1.json"
      - "data/parables/registry/**"
      - "schemas/rafaelia-semantic-tensor.v1.schema.json"
      - "scripts/semantic_tensor_parable_engine.py"
      - "tests/test_semantic_tensor_parable_engine.py"
      - "tests/test_parable_registry.py"
      - "tests/fixtures/semantic_tensor_inputs.json"
      - "docs/architecture/RAFAELIA_SEMANTIC_TENSOR_PARABLE_ENGINE_V1.md"
      - ".github/workflows/semantic-tensor-parable-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-tensor-parable-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: semantic-tensor / validate
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Contract tests
        run: |
          python -m unittest -v \
            tests.test_semantic_tensor_parable_engine \
            tests.test_parable_registry

      - name: Execute deterministic fixture
        run: |
          python scripts/semantic_tensor_parable_engine.py \
            --input tests/fixtures/semantic_tensor_inputs.json \
            --output artifacts/semantic-tensor/receipt.json

      - name: Verify fail-closed boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(
              Path("artifacts/semantic-tensor/receipt.json").read_text()
          )
          assert receipt["model_mutation"] is False
          assert receipt["claim_allowed"] is False
          assert receipt["automatic_promotion"] is False
          assert receipt["record_count"] == 6
          decisions = receipt["decision_counts"]
          assert decisions["BLOCKED_TOKEN_VAZIO"] == 1
          assert decisions["BLOCKED_UNSOURCED_CULTURAL_ATTRIBUTION"] == 1
          assert decisions["PARABLE_ANALOGY_NO_FACT_PROMOTION"] == 1
          assert decisions["PRESERVED_AS_CONFESSION_NOT_DOMAIN_CLAIM"] == 1
          assert decisions["READY_FOR_HUMAN_REVIEW"] == 1
          assert decisions["TOKEN_VAZIO"] == 1
          PY

      - name: Upload audit receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semantic-tensor-receipt-${{ github.run_id }}
          path: artifacts/semantic-tensor/receipt.json
          if-no-files-found: error
          retention-days: 30
