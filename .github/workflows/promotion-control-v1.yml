name: RAFAELIA Promotion Control V1

"on":
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
      - converted_to_draft
  pull_request_review:
    types:
      - submitted
      - dismissed
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: rafaelia-promotion-control-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  negative-tests:
    name: promotion-control / negative-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Compile and run fail-closed fixtures
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/verify_promotion_control.py \
            tools/check_invariants.py \
            tools/check_invariants_v2.py \
            tests/test_promotion_control.py
          python tests/test_promotion_control.py

      - name: Validate 15 Rafaelia invariants (P1-02 gate)
        run: |
          set -euo pipefail
          python tools/check_invariants_v2.py

  enforce:
    name: promotion-control / enforce
    if: ${{ github.event_name != 'workflow_dispatch' }}
    needs: negative-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Capture reviews without exposing token
        env:
          GITHUB_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          url = (
              f"{os.environ['API_URL']}/repos/{os.environ['REPOSITORY']}"
              f"/pulls/{os.environ['PR_NUMBER']}/reviews?per_page=100"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "rafaelia-promotion-control-v1",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              reviews = json.load(response)
          with open("promotion-reviews.json", "w", encoding="utf-8") as handle:
              json.dump(reviews, handle, ensure_ascii=False, sort_keys=True)
              handle.write("\n")
          PY

      - name: Validate claim_allowed=false (V1-01 gate)
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys

          with open("promotion-reviews.json", "r", encoding="utf-8") as f:
              reviews = json.load(f)

          for idx, review in enumerate(reviews):
              body = review.get("body", "")
              if body and ("claim_allowed" in body.lower() or "promotion" in body.lower()):
                  try:
                      if '"claim_allowed": true' in body or "claim_allowed=true" in body or "claim_allowed: true" in body.lower():
                          print(f"ERROR: Review {idx} contains claim_allowed=true (DENIED)")
                          sys.exit(1)
                  except Exception:
                      pass

          print("✓ All reviews validated: no claim_allowed=true detected")
          PY

      - name: Enforce manual promotion decision
        run: |
          set -euo pipefail
          python tools/verify_promotion_control.py \
            --event "$GITHUB_EVENT_PATH" \
            --reviews promotion-reviews.json \
            --policy data/control-plane/promotion-control.v1.json \
            | tee promotion-control-result.json
