name: Relationship House V1 Audit

on:
  pull_request:
    paths:
      - 'RAFAELIA_RELATIONSHIP_HOUSE_V1/**'
      - '.github/workflows/relationship-house-v1.yml'
      - 'data/audits/TOKEN_VAZIO_REGISTRY.jsonl'
  push:
    paths:
      - 'RAFAELIA_RELATIONSHIP_HOUSE_V1/**'
      - '.github/workflows/relationship-house-v1.yml'
      - 'data/audits/TOKEN_VAZIO_REGISTRY.jsonl'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Audit authority, taxonomy and public boundary
        run: python3 RAFAELIA_RELATIONSHIP_HOUSE_V1/09_RUNTIME/raf_audit.py
