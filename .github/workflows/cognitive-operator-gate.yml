name: Cognitive operator invariant

on:
  pull_request:
    paths:
      - "data/ontology/cognitive-operators.v1.json"
      - "data/ontology/cognitive-operators/**"
      - "scripts/validate_cognitive_operators.py"
      - "tests/test_cognitive_operators.py"
      - "docs/COGNITIVE_OPERATOR_INVARIANT_V1.md"
      - ".github/workflows/cognitive-operator-gate.yml"
  push:
    branches: [main]
    paths:
      - "data/ontology/cognitive-operators.v1.json"
      - "data/ontology/cognitive-operators/**"
      - "scripts/validate_cognitive_operators.py"
      - "tests/test_cognitive_operators.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@b4ffde65f46336ab88eb53b2ddc3a3808b9a7055
      - uses: actions/setup-python@f677139bbe7f9c59030f3aa62b693246ab674ec9
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile scripts/validate_cognitive_operators.py tests/test_cognitive_operators.py
      - name: Unit tests
        run: python -m unittest -v tests/test_cognitive_operators.py
      - name: Registry audit
        run: |
          python scripts/validate_cognitive_operators.py \
            --manifest data/ontology/cognitive-operators.v1.json \
            --output build/cognitive-operators/audit.json
      - uses: actions/upload-artifact@c7d193f32eddeaeca500a8efe53f51ff053605ad
        with:
          name: cognitive-operator-audit
          path: build/cognitive-operators/audit.json
          if-no-files-found: error
