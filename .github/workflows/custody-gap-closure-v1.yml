name: Custody Gap Closure V1

on:
  pull_request:
    paths:
      - "schemas/custody-gap-closure-model-v1.schema.json"
      - "data/governance/custody/06_GAPS/CUSTODY_GAP_CLOSURE_MODEL_V1.json"
      - "tools/validate_custody_gap_closure_v1.py"
      - "tests/test_custody_gap_closure_v1.py"
      - ".github/workflows/custody-gap-closure-v1.yml"
  push:
    paths:
      - "schemas/custody-gap-closure-model-v1.schema.json"
      - "data/governance/custody/06_GAPS/CUSTODY_GAP_CLOSURE_MODEL_V1.json"
      - "tools/validate_custody_gap_closure_v1.py"
      - "tests/test_custody_gap_closure_v1.py"
      - ".github/workflows/custody-gap-closure-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Compile
        run: |
          python -m py_compile tools/validate_custody_gap_closure_v1.py
          python -m py_compile tests/test_custody_gap_closure_v1.py
      - name: Validate gap closure model
        run: python tools/validate_custody_gap_closure_v1.py
      - name: Unit tests
        run: python -m unittest tests.test_custody_gap_closure_v1 -v
