name: Workflow Supply-Chain Ratchet

"on":
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  immutable-action-refs:
    name: Changed workflows use immutable action refs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact event revision without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Reject mutable external action references in changed workflows
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          require_commit() {
            local sha="$1"
            local label="$2"
            if [ -z "$sha" ]; then
              echo "ERROR: missing $label; refusing live-ref fallback."
              exit 1
            fi
            if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
              echo "ERROR: $label $sha is not available as a commit; refusing live-ref fallback."
              exit 1
            fi
          }

          if [ "$EVENT_NAME" = "pull_request" ]; then
            require_commit "$PR_BASE_SHA" "pull_request.base.sha"
            require_commit "$PR_HEAD_SHA" "pull_request.head.sha"
            range="$PR_BASE_SHA...$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            require_commit "$EVENT_SHA" "github.sha"
            zero="0000000000000000000000000000000000000000"
            if [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "$zero" ]; then
              require_commit "$BEFORE_SHA" "github.event.before"
              range="$BEFORE_SHA..$EVENT_SHA"
            else
              range="$EVENT_SHA^..$EVENT_SHA"
            fi
          else
            require_commit "$EVENT_SHA" "github.sha"
            range="$EVENT_SHA^..$EVENT_SHA"
          fi

          export RANGE="$range"
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import sys

          sha40 = re.compile(r"^[0-9a-fA-F]{40}$")
          uses_re = re.compile(r"^\s*-?\s*uses:\s*([^\s#]+)")
          range_spec = os.environ["RANGE"]
          event_name = os.environ.get("EVENT_NAME", "")

          touched = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=ACMRD", range_spec, "--", ".github/workflows"],
              text=True,
          ).splitlines()
          touched = sorted(
              p for p in touched
              if p.endswith((".yml", ".yaml"))
          )

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=ACMR", range_spec, "--", ".github/workflows"],
              text=True,
          ).splitlines()
          changed = sorted(
              p for p in changed
              if p.endswith((".yml", ".yaml")) and pathlib.Path(p).is_file()
          )

          print(f"Exact range: {range_spec}")
          print(f"Workflow files touched: {len(touched)}")
          for name in touched:
              print(f"  {name}")

          if event_name == "pull_request" and not touched:
              print("ERROR: pull_request workflow event resolved to an empty exact-SHA workflow diff.")
              print("Refusing to infer success from a live branch state or post-merge race.")
              sys.exit(1)

          violations = []
          for name in changed:
              for lineno, line in enumerate(pathlib.Path(name).read_text(errors="replace").splitlines(), 1):
                  match = uses_re.match(line)
                  if not match:
                      continue
                  ref = match.group(1).strip("'\"")
                  if ref.startswith("./"):
                      continue
                  if ref.startswith("docker://"):
                      if "@sha256:" not in ref:
                          violations.append((name, lineno, ref, "container action is not digest-pinned"))
                      continue
                  if "@" not in ref:
                      violations.append((name, lineno, ref, "missing immutable ref"))
                      continue
                  revision = ref.rsplit("@", 1)[1]
                  if not sha40.fullmatch(revision):
                      violations.append((name, lineno, ref, "ref is not a full 40-character commit SHA"))

          if violations:
              print("ERROR: mutable external action references retained or introduced in changed workflows:")
              for name, lineno, ref, reason in violations:
                  print(f"  {name}:{lineno}: {ref} — {reason}")
              print("Pin every external GitHub Action in each touched, non-deleted workflow to an immutable full commit SHA.")
              sys.exit(1)

          print("PASS: exact event-SHA diff contains no mutable external action references in changed workflows.")
          PY
