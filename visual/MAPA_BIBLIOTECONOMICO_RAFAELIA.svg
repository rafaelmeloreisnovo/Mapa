<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg{fill:#f7f8fb}
      .title{fill:#1a2233;font-size:26px;font-weight:700}
      .sub{fill:#4a5568;font-size:14px}
      .axisL{fill:#1e5aa8;font-size:15px;font-weight:700}
      .axisR{fill:#8a3a86;font-size:15px;font-weight:700}
      .box{stroke-width:2;rx:10}
      .lbl{fill:#1a2233;font-size:14px;font-weight:700}
      .item{fill:#2d3748;font-size:11.5px}
      .note{fill:#5a6472;font-size:11px}
      .nota{fill:#7a8290;font-size:11px;font-style:italic}
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1040" height="760"/>
  <text class="title" x="40" y="46">Mapa Biblioteconômico RAFAELIA</text>
  <text class="sub" x="40" y="70">28 repositórios · classificação facetada RAF.* · dois eixos co-válidos · fonte: README (2026-07-05)</text>

  <!-- axis labels -->
  <text class="axisL" x="40" y="104">◀ eixo científico-acadêmico</text>
  <text class="axisR" x="1000" y="104" text-anchor="end">eixo filosófico-espiritual universalista ▶</text>

  <!-- META / ORG (top center) -->
  <rect class="box" x="360" y="122" width="320" height="66" fill="#eef1f6" stroke="#5a6472"/>
  <text class="lbl" x="520" y="146" text-anchor="middle">META / ORGANIZAÇÃO (ORG)</text>
  <text class="item" x="520" y="168" text-anchor="middle">Mapa · MemRafcode</text>
  <text class="nota" x="520" y="183" text-anchor="middle">catálogo e custódia — onde vive esta biblioteconomia</text>

  <!-- CIÊNCIA & MATEMÁTICA (left) -->
  <rect class="box" x="40" y="214" width="290" height="96" fill="#e6eef8" stroke="#1e5aa8"/>
  <text class="lbl" x="56" y="238">CIÊNCIA &amp; MATEMÁTICA</text>
  <text class="item" x="56" y="260">relativity-living-light (RLL, DOI)</text>
  <text class="item" x="56" y="278">Matem-tica- (Forma Normal 123)</text>
  <text class="item" x="56" y="296">papers (exacordex / raefaelos)</text>

  <!-- ESPIRITUAL / PUBLICAÇÃO (right) -->
  <rect class="box" x="710" y="214" width="290" height="96" fill="#f3e9f3" stroke="#8a3a86"/>
  <text class="lbl" x="726" y="238">ESPIRITUAL / PUBLICAÇÃO</text>
  <text class="item" x="726" y="260">LivroVivo · Blackhole</text>
  <text class="item" x="726" y="278">publicacientiespiritual</text>
  <text class="item" x="726" y="296">ZIPRAF_OMEGA_FULL</text>

  <!-- ÉTICA / JURÍDICO (center) -->
  <rect class="box" x="380" y="214" width="280" height="96" fill="#eef1f6" stroke="#5a6472"/>
  <text class="lbl" x="396" y="238">ÉTICA / JURÍDICO</text>
  <text class="item" x="396" y="260">RafPolimata</text>
  <text class="item" x="396" y="278">Rafaelia_Private</text>
  <text class="item" x="396" y="296">LGPD-Constituicoes-…</text>

  <!-- COGNIÇÃO / IA / DADOS (left-mid) -->
  <rect class="box" x="40" y="336" width="290" height="96" fill="#e9f2ec" stroke="#2f7d4f"/>
  <text class="lbl" x="56" y="360">COGNIÇÃO / IA / DADOS</text>
  <text class="item" x="56" y="382">X0 · llamaRafaelia</text>
  <text class="item" x="56" y="400">home (análise científica)</text>
  <text class="item" x="56" y="418">CONVERSATIONS_CHUNKS</text>

  <!-- PLATAFORMA / ANDROID / VM (bottom-left) -->
  <rect class="box" x="40" y="458" width="470" height="118" fill="#f2efe6" stroke="#8a6d2f"/>
  <text class="lbl" x="56" y="482">PLATAFORMA / ANDROID / VIRTUALIZAÇÃO</text>
  <text class="item" x="56" y="504">RafGitTools · Vectras-VM-Android</text>
  <text class="item" x="56" y="522">termux-app · termux-api · UserLAnd</text>
  <text class="item" x="56" y="540">PCR (Magisk) · qemu_rafaelia · actions</text>
  <text class="nota" x="56" y="562">7 forks com upstream declarado</text>

  <!-- NÚCLEO DETERMINÍSTICO (bottom-right) -->
  <rect class="box" x="540" y="458" width="460" height="118" fill="#eaecef" stroke="#3a4658"/>
  <text class="lbl" x="556" y="482">NÚCLEO DETERMINÍSTICO (C/ASM)</text>
  <text class="item" x="556" y="504">ChipQuantum · DeepSeek-RafCoder</text>
  <text class="item" x="556" y="522">GAIA_phi · BLAKE3</text>
  <text class="nota" x="556" y="544">primitivos: hash, runtime, T⁷/42, freestanding</text>

  <!-- honesty rule band -->
  <rect x="40" y="606" width="960" height="118" fill="#ffffff" stroke="#cbd2dc"/>
  <text class="lbl" x="56" y="630">Regra de honestidade — separar prova de metáfora</text>
  <text class="item" x="56" y="654">FATO = evidência direta   ·   HIPOTESE = plausível não provado   ·   SIMBOLICO = leitura filosófica/espiritual   ·   LACUNA = ausência protegida</text>
  <text class="note" x="56" y="676">Notação facetada: RAF.&lt;Domínio&gt;.&lt;Operação&gt;.&lt;Dimensão&gt;.&lt;Maturidade&gt;  (ponte para CDU em 01_PLANO_DE_CLASSIFICACAO.md)</text>
  <text class="note" x="56" y="696">Fricção semântica reconciliada por qualificação de referente: 42 · Φ/phi · toroide · invariante · verdade · ZIPRAF · vetor · ética</text>
  <text class="nota" x="56" y="714">Honrar o eixo espiritual É marcá-lo SIMBOLICO com dignidade — nem "falso", nem "prova".</text>
</svg>
