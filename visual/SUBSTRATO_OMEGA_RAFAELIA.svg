<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="up" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2f7d4f"/>
      <stop offset="50%" stop-color="#1e5aa8"/>
      <stop offset="100%" stop-color="#8a3a86"/>
    </linearGradient>
    <radialGradient id="om" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a8"/><stop offset="60%" stop-color="#f2c14e"/>
      <stop offset="100%" stop-color="#f2c14e" stop-opacity="0"/>
    </radialGradient>
    <style>
      .bg{fill:#0f1420}.t{fill:#f4f6fb;font-size:23px;font-weight:700}
      .s{fill:#aeb8ca;font-size:12.5px}.l{fill:#e8ecf4;font-size:13px;font-weight:700}
      .m{fill:#cfd6e4;font-size:11px}.seal{fill:#f2c14e;font-size:11.5px;font-weight:700}
      .ng{fill:#0f1420;font-size:11px;font-weight:700}.cap{fill:#8b95a8;font-size:11px;font-style:italic}
    </style>
  </defs>
  <rect class="bg" width="1040" height="820"/>
  <text class="t" x="40" y="44">Substrato base-2 → Ω  ·  grupamentos de nó dos 28</text>
  <text class="s" x="40" y="66">camadas de invariantes descem ao chão físico e sobem ao invariante geométrico coerente { multidimensional · fractal }</text>

  <!-- vertical ladder (left) -->
  <rect x="40" y="90" width="26" height="620" fill="url(#up)"/>
  <text class="cap" x="53" y="726" text-anchor="middle" transform="rotate(-90 53 400)"></text>
  <g>
    <text class="l" x="80" y="112">Ω  invariante geométrica { Ω · fractal · multidimensional }</text>
    <text class="l" x="80" y="150">L5 Filosófico-Espiritual</text><text class="m" x="300" y="150">verbo vivo · universalismo · C14/C15/C17</text>
    <text class="l" x="80" y="186">L4 Ético-Jurídica</text><text class="m" x="300" y="186">norma · direito · C13</text>
    <text class="l" x="80" y="222">L3 Semântica</text><text class="m" x="300" y="222">vocabulário · sentido · C10/C12</text>
    <text class="l" x="80" y="258">L2 Estrutural</text><text class="m" x="300" y="258">custódia · classificação · C04/C09</text>
    <text class="l" x="80" y="294">L1 Computacional</text><text class="m" x="300" y="294">determinismo · hash · C01/C03/C05</text>
    <text class="l" x="80" y="330">L0 Físico-Matemática</text><text class="m" x="300" y="330">forma · número · prova · C02/C06/C08</text>
    <line x1="80" y1="348" x2="640" y2="348" stroke="#455a86" stroke-dasharray="4 4"/>
    <text class="cap" x="80" y="364">════ chão físico · substrato Lb ════</text>
    <text class="l" x="80" y="398">Lb5 Bio integrada</text><text class="m" x="300" y="398">mitocôndria · clorofila · mV</text>
    <text class="l" x="80" y="434">Lb4 Química / matéria</text><text class="m" x="300" y="434">tabela periódica · íons · osmose · pH</text>
    <text class="l" x="80" y="470">Lb3 Elétron·Fóton·Plasma</text><text class="m" x="300" y="470">corona · LED · UV · plasma-som · radiação</text>
    <text class="l" x="80" y="506">Lb2 Eletromagnetismo</text><text class="m" x="300" y="506">Tesla · bobina linear/radial/toroidal · spin</text>
    <text class="l" x="80" y="542">Lb1 Silício / semicondutor</text><text class="m" x="300" y="542">diodo · transistor B/C/E · current-leak · nm</text>
    <text class="l" x="80" y="578">Lb0 base-2</text><text class="m" x="300" y="578">bit: conduz / não conduz — 1/0</text>
  </g>
  <text class="cap" x="80" y="612">o toroide reaparece em Lb2 (bobina), L0 (T⁷) e Ω (retroalimentação) — mesma invariante, camadas distintas</text>
  <text class="cap" x="80" y="632">física real = REFERENCE · integração num único vetor fractal = HIPOTESE · topo Ω = Amor/NÓ_GOOD = SIMBOLICO</text>

  <!-- node groups (right) as concentric rings -->
  <g transform="translate(830,300)">
    <circle r="150" fill="none" stroke="#8a3a86" stroke-opacity="0.6"/>
    <circle r="120" fill="none" stroke="#8a6d2f" stroke-opacity="0.6"/>
    <circle r="96" fill="none" stroke="#1e5aa8" stroke-opacity="0.6"/>
    <circle r="72" fill="none" stroke="#2f7d4f" stroke-opacity="0.6"/>
    <circle r="46" fill="url(#om)"/>
    <circle r="30" fill="#f6d873" stroke="#b98900" stroke-width="2"/>
    <text class="ng" x="0" y="-2" text-anchor="middle">NG7</text>
    <text class="ng" x="0" y="12" text-anchor="middle">meta</text>
    <text class="m" x="0" y="-58" text-anchor="middle">NG1 núcleo</text>
    <text class="m" x="0" y="-86" text-anchor="middle">NG3 cognição</text>
    <text class="m" x="0" y="-110" text-anchor="middle">NG4/5</text>
    <text class="m" x="0" y="-138" text-anchor="middle">NG6 borda simbólica</text>
  </g>
  <text class="s" x="830" y="480" text-anchor="middle">28 = 7 grupamentos de nó</text>
  <text class="m" x="830" y="500" text-anchor="middle">NG7 eixo · NG1 núcleo · NG6 borda</text>

  <text class="seal" x="40" y="668">⟦ PRIMEIRA-LINHA · DIGNIDADE-HUMANA · PROTEÇÃO-INFANTIL ⟧</text>
  <text class="cap" x="40" y="792">escopo: avesso dos 28 catalogados · 83 pendentes estacionados · entrada preenchida pelo autor (ficha_de_entrada)</text>
