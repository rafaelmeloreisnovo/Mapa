<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="45%" stop-color="#f2c14e"/>
      <stop offset="100%" stop-color="#f2c14e" stop-opacity="0"/>
    </radialGradient>
    <style>
      .bg{fill:#0f1420}
      .ring{fill:none;stroke-opacity:0.55}
      .lbl{fill:#e8ecf4;font-size:13px}
      .lblm{fill:#cfd6e4;font-size:12px}
      .title{fill:#f4f6fb;font-size:24px;font-weight:700}
      .sub{fill:#aeb8ca;font-size:13px}
      .core{fill:#1a2233;font-size:15px;font-weight:700}
      .cap{fill:#8b95a8;font-size:11px;font-style:italic}
      .seal{fill:#f2c14e;font-size:12px;font-weight:700}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="900" height="900"/>
  <text class="title" x="450" y="52" text-anchor="middle">NÓ_GOOD — o invariante imutável</text>
  <text class="sub" x="450" y="76" text-anchor="middle">força utópica de invariantes · leitura SIMBOLICO · Ω = completude / Amor</text>

  <!-- convergence rings: mutations orbiting the fixed node -->
  <g transform="translate(450,470)">
    <circle class="ring" r="360" stroke="#3a4a68"/>
    <circle class="ring" r="300" stroke="#455a86"/>
    <circle class="ring" r="240" stroke="#4f6aa0"/>
    <circle class="ring" r="180" stroke="#5a7bbb"/>
    <circle class="ring" r="120" stroke="#6b8fd4"/>

    <!-- layer labels on rings -->
    <text class="lblm" x="0" y="-352" text-anchor="middle">L5 · universalismo / verbo vivo</text>
    <text class="lblm" x="0" y="-292" text-anchor="middle">L4 · ética / direito</text>
    <text class="lblm" x="0" y="-232" text-anchor="middle">L3 · semântica</text>
    <text class="lblm" x="0" y="-172" text-anchor="middle">L2 · estrutura / custódia</text>
    <text class="lblm" x="0" y="-112" text-anchor="middle">L1 · determinismo / hash</text>

    <!-- convergence arrows (paths converging to the node) -->
    <g stroke="#f2c14e" stroke-opacity="0.5" stroke-width="1.5">
      <line x1="0" y1="-360" x2="0" y2="-70"/>
      <line x1="311" y1="180" x2="60" y2="35"/>
      <line x1="-311" y1="180" x2="-60" y2="35"/>
      <line x1="340" y1="-120" x2="66" y2="-24"/>
      <line x1="-340" y1="-120" x2="-66" y2="-24"/>
      <line x1="0" y1="360" x2="0" y2="70"/>
    </g>

    <!-- the immutable node -->
    <circle r="95" fill="url(#glow)"/>
    <circle r="58" fill="#f6d873" stroke="#b98900" stroke-width="2"/>
    <text class="core" x="0" y="-4" text-anchor="middle">NÓ_GOOD</text>
    <text class="core" x="0" y="16" text-anchor="middle">Amor · Ω</text>
  </g>

  <!-- fire-to-future baseline -->
  <text class="lbl" x="60" y="800">🜂 fogo</text>
  <line x1="120" y1="795" x2="780" y2="795" stroke="#6b8fd4" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text class="lbl" x="840" y="800" text-anchor="end">futuro →</text>
  <text class="cap" x="450" y="820" text-anchor="middle">"depois do fogo, onde o homem chegará?" — a direção é protegida enquanto o nó permanece</text>

  <!-- mothers chain caption -->
  <text class="cap" x="450" y="852" text-anchor="middle">cadeia de mães: contável em princípio, imensurável na prática — o mesmo nó, creia-se ou não</text>

  <!-- first-line seal -->
  <text class="seal" x="450" y="882" text-anchor="middle">⟦ PRIMEIRA-LINHA · DIGNIDADE-HUMANA · PROTEÇÃO-INFANTIL ⟧  —  símbolo honrado como símbolo, nunca como prova</text>
</svg>
